<style>
/* ═══════════════════════════════════════════════════════════════════════
   BRIOCHE LAB PRO — Stili
   Mobile-first PWA professionale
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --navy: #1B3A6B;
  --navy-dark: #11264A;
  --navy-light: #2D5089;
  --amber: #E8A020;
  --amber-dark: #B8800F;
  --amber-bg: #FDF8F0;
  --cream: #FFFEF8;
  --light-bg: #F0F4FA;
  --green: #2E7D32;
  --green-bg: #E8F5E9;
  --red: #C0392B;
  --red-bg: #FFE5E5;
  --grey-bord: #D5D9E0;
  --grey-light: #EEF1F5;
  --text: #1A1F2E;
  --muted: #6B7280;
  --shadow-sm: 0 1px 2px rgba(27, 58, 107, 0.06);
  --shadow-md: 0 4px 12px rgba(27, 58, 107, 0.08);
  --shadow-lg: 0 8px 24px rgba(27, 58, 107, 0.12);
  --safe-top: env(safe-area-inset-top, 0);
  --safe-bot: env(safe-area-inset-bottom, 0);
}

[data-theme="dark"] {
  --navy: #4A7AB8;
  --navy-dark: #2D5089;
  --amber: #FFB840;
  --amber-bg: #2A2418;
  --cream: #1A1F2E;
  --light-bg: #0F1419;
  --green-bg: #1A2E1C;
  --red-bg: #2E1A1A;
  --grey-bord: #2A3142;
  --grey-light: #1F2433;
  --text: #E8EAF0;
  --muted: #9CA3AF;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}

[data-theme="dark"] body {
  background: var(--light-bg);
}
[data-theme="dark"] .card,
[data-theme="dark"] .kpi,
[data-theme="dark"] .table-wrap,
[data-theme="dark"] .modal {
  background: #1A2031;
  border-color: var(--grey-bord);
}
[data-theme="dark"] .table thead { background: var(--navy-dark); }
[data-theme="dark"] .table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
[data-theme="dark"] .field-input,
[data-theme="dark"] .field-select,
[data-theme="dark"] .field-textarea {
  background: #0F1419;
  color: var(--text);
  border-color: var(--grey-bord);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--light-bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body.kitchen-mode {
  font-size: 17px;
}

body.kitchen-mode .btn { padding: 14px 22px; font-size: 16px; }
body.kitchen-mode .page-title { font-size: 36px; }
body.kitchen-mode .kpi-value { font-size: 40px; }
body.kitchen-mode .table { font-size: 16px; }
body.kitchen-mode .table th, body.kitchen-mode .table td { padding: 18px 14px; }

button { font-family: inherit; cursor: pointer; border: none; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Fraunces', serif; font-weight: 700; }

/* ═══════ APP SHELL ═══════ */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ═══════ SIDEBAR ═══════ */
.sidebar {
  background: var(--navy);
  color: white;
  padding: calc(20px + var(--safe-top)) 0 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 10;
}

.brand {
  padding: 0 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 38px; height: 38px;
  background: var(--amber-bg);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-icon svg { width: 26px; height: 26px; }

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1.1;
}

.brand-subtitle {
  font-size: 10px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-top: 2px;
}

.brand-accent { color: var(--amber); }

.nav { padding: 8px 0; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  color: rgba(255,255,255,0.75);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-size: 14px;
  font-weight: 500;
  user-select: none;
}

.nav-item:hover { background: rgba(255,255,255,0.05); color: white; }

.nav-item.active {
  background: rgba(232, 160, 32, 0.12);
  color: white;
  border-left-color: var(--amber);
  font-weight: 600;
}

.nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }
.nav-item.active .nav-icon { opacity: 1; color: var(--amber); }

.nav-section {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: rgba(255,255,255,0.4);
  padding: 16px 20px 6px;
  font-weight: 700;
}

.sidebar-footer {
  margin-top: 20px;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}

/* ═══════ MAIN ═══════ */
.main {
  padding: 24px 32px calc(40px + var(--safe-bot));
  max-width: 100%;
  overflow-x: hidden;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 16px;
}

.page-title {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.8px;
  color: var(--navy);
  line-height: 1.1;
}

.page-subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-top: 4px;
}

/* ═══════ MOBILE TOPBAR ═══════ */
.mobile-bar {
  display: none;
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--navy);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  align-items: center;
  justify-content: space-between;
  color: white;
}

.mobile-brand {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.menu-btn {
  width: 38px;
  height: 38px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-btn:active { background: rgba(255,255,255,0.2); }

/* ═══════ CARDS ═══════ */
.card {
  background: white;
  border-radius: 14px;
  padding: 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--grey-bord);
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 12px;
}

.card-h {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}

/* ═══════ KPI ═══════ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.kpi {
  background: white;
  border-radius: 14px;
  padding: 18px 20px;
  border: 1px solid var(--grey-bord);
  border-left: 4px solid var(--amber);
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s;
}

.kpi:active { transform: scale(0.98); }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.kpi-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  font-weight: 700;
}

.kpi-value {
  font-family: 'Fraunces', serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--navy);
  margin-top: 6px;
  letter-spacing: -0.5px;
  line-height: 1;
}

.kpi-detail {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

.kpi--blue { border-left-color: var(--navy); }
.kpi--green { border-left-color: var(--green); }
.kpi--red { border-left-color: var(--red); }

/* ═══════ BUTTONS ═══════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.15s;
  background: var(--navy);
  color: white;
  text-decoration: none;
  white-space: nowrap;
}

.btn:hover { background: var(--navy-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { transform: none; box-shadow: none; }

.btn--amber { background: var(--amber); color: white; }
.btn--amber:hover { background: var(--amber-dark); }

.btn--ghost { background: white; color: var(--navy); border: 1px solid var(--grey-bord); }
.btn--ghost:hover { background: var(--light-bg); }
[data-theme="dark"] .btn--ghost { background: transparent; color: var(--text); }

.btn--danger { background: var(--red-bg); color: var(--red); }
.btn--danger:hover { background: var(--red); color: white; }

.btn--small { padding: 7px 12px; font-size: 13px; }
.btn--icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ═══════ FORMS ═══════ */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.field { display: flex; flex-direction: column; }

.field-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.field-input, .field-select, .field-textarea {
  padding: 11px 14px;
  border: 1.5px solid var(--grey-bord);
  border-radius: 10px;
  background: var(--cream);
  font-size: 15px;
  color: var(--text);
  transition: border 0.15s, box-shadow 0.15s;
}

.field-input:focus, .field-select:focus, .field-textarea:focus {
  outline: none;
  border-color: var(--amber);
  background: white;
  box-shadow: 0 0 0 3px rgba(232, 160, 32, 0.15);
}
[data-theme="dark"] .field-input:focus,
[data-theme="dark"] .field-select:focus,
[data-theme="dark"] .field-textarea:focus { background: #0A0E13; }

.field-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
.field--full { grid-column: 1 / -1; }
.field-help { font-size: 12px; color: var(--muted); margin-top: 5px; }

/* ═══════ TABLES ═══════ */
.table-wrap {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--grey-bord);
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table thead { background: var(--navy); color: white; position: sticky; top: 0; }
.table th { padding: 13px 16px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.table td { padding: 14px 16px; border-top: 1px solid var(--grey-light); }
.table tbody tr:hover { background: var(--amber-bg); }
.table tbody tr:nth-child(even) { background: rgba(240, 244, 250, 0.4); }
.table tbody tr:nth-child(even):hover { background: var(--amber-bg); }

.table-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }

/* ═══════ PILLS ═══════ */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  background: var(--light-bg);
  color: var(--navy);
}
.pill--green { background: var(--green-bg); color: var(--green); }
.pill--red { background: var(--red-bg); color: var(--red); }
.pill--amber { background: var(--amber-bg); color: var(--amber-dark); }
.pill--blue { background: rgba(31, 79, 130, 0.12); color: var(--navy); }
[data-theme="dark"] .pill { background: rgba(255,255,255,0.1); }

/* ═══════ CLIENTE CARD GRID (dashboard ordini) ═══════ */
.cliente-sezione {
  margin-bottom: 28px;
}
.cliente-sezione-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding: 10px 14px;
  border-radius: 10px;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 600;
}
.cliente-sezione-h .badge {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(255,255,255,0.7);
}
.cliente-sezione--verde .cliente-sezione-h { background: var(--green-bg); color: var(--green); }
.cliente-sezione--blu .cliente-sezione-h { background: rgba(31, 79, 130, 0.10); color: var(--navy); }
.cliente-sezione--bianco .cliente-sezione-h { background: var(--light-bg); color: var(--muted); }

.cliente-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}
@media (max-width: 600px) {
  .cliente-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
}

.cliente-card {
  background: var(--card-bg);
  border: 2px solid var(--grey-bord);
  border-radius: 14px;
  padding: 14px 12px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  min-height: 150px;
  position: relative;
}
.cliente-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
.cliente-card--verde { border-color: var(--green); background: linear-gradient(180deg, var(--green-bg) 0%, var(--card-bg) 50%); }
.cliente-card--verde:hover { border-color: var(--green); box-shadow: 0 6px 20px rgba(34,134,58,0.22); }
.cliente-card--blu { border-color: var(--navy); background: linear-gradient(180deg, rgba(31, 79, 130, 0.12) 0%, var(--card-bg) 60%); }
.cliente-card--blu:hover { border-color: var(--navy); box-shadow: 0 6px 20px rgba(31,79,130,0.22); }
.cliente-card--bianco { border-color: var(--grey-bord); }
.cliente-card--bianco:hover { border-color: var(--amber); }

.cliente-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 18px;
  color: white;
  letter-spacing: 0.5px;
  position: relative;
}
.cliente-card--verde .cliente-avatar { background: var(--green); }
.cliente-card--blu .cliente-avatar { background: var(--navy); }
.cliente-card--bianco .cliente-avatar { background: var(--grey-bord); color: var(--muted); }
.cliente-avatar .check-badge {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: white;
  color: var(--green);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--green);
  font-weight: 900;
}
.cliente-nome {
  font-weight: 600;
  font-size: 13px;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text);
}
.cliente-info {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: auto;
}
.cliente-info strong { color: var(--text); }
.cliente-info .orario { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--navy); }
.cliente-card--verde .cliente-info .orario { color: var(--green); }
.cliente-info .nota {
  font-style: italic;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 100%;
}

/* Ordini del cliente (modale drill-down) */
.ordini-giorno-h {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--navy);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 18px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--grey-bord);
}
.ordine-mini-card {
  padding: 12px 14px;
  background: var(--light-bg);
  border-radius: 10px;
  margin-bottom: 8px;
  border-left: 4px solid var(--navy);
}
.ordine-mini-card--consegnato { border-left-color: var(--green); opacity: 0.85; }
.ordine-mini-card--annullato { border-left-color: var(--red); opacity: 0.6; text-decoration: line-through; }

/* ═══════ EMPTY ═══════ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.7; }
.empty-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  color: var(--navy);
  margin-bottom: 10px;
  font-weight: 700;
}
.empty-text { font-size: 14px; max-width: 400px; margin: 0 auto 18px; line-height: 1.6; }

/* ═══════ MODAL ═══════ */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(27, 38, 74, 0.6);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  padding-top: max(16px, var(--safe-top));
  padding-bottom: max(16px, var(--safe-bot));
  animation: fadeIn 0.2s;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: white;
  border-radius: 18px;
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--grey-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: inherit;
  z-index: 1;
  border-radius: 18px 18px 0 0;
}

.modal-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
}

.modal-close {
  background: var(--light-bg);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
}

.modal-close:hover { background: var(--red-bg); color: var(--red); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--grey-light);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--light-bg);
  position: sticky;
  bottom: 0;
  border-radius: 0 0 18px 18px;
}

/* ═══════ LOT CODE DISPLAY ═══════ */
.lot-display {
  background: var(--navy);
  color: white;
  padding: 14px 18px;
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-align: center;
  margin: 12px 0;
}

/* ═══════ BANNER ═══════ */
.banner {
  padding: 14px 18px;
  border-radius: 12px;
  background: var(--amber-bg);
  border-left: 4px solid var(--amber);
  margin-bottom: 20px;
  font-size: 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.banner--info { background: var(--light-bg); border-left-color: var(--navy); }
.banner--green { background: var(--green-bg); border-left-color: var(--green); }

.banner-icon {
  flex-shrink: 0;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--amber);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
}
.banner--info .banner-icon { background: var(--navy); }
.banner--green .banner-icon { background: var(--green); }
.banner-content { flex: 1; }
.banner-title { font-weight: 700; color: var(--navy); margin-bottom: 2px; }

/* ═══════ GIST SYNC BANNER ═══════ */
.gist-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--light-bg);
  border: 1px solid var(--grey-light);
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.gist-banner .btn { margin-left: auto; }
.notifiche-badge {
  display: inline-block;
  background: var(--red);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 10px;
  padding: 1px 7px;
  margin-left: 6px;
}
.notifica-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-bottom: 1px solid var(--grey-light);
}
.notifica-item.unread { background: var(--amber-bg); }
.notifica-item .nbody { flex: 1; }
.notifica-item .ntime { font-size: 12px; color: var(--muted); }

/* ═══════ SECTION ═══════ */
.section { margin-bottom: 32px; }
.section-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 12px;
  flex-wrap: wrap;
}
.section-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.3px;
}
.section-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ═══════ TWO-COL ═══════ */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

/* ═══════ FAB ═══════ */
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(24px + var(--safe-bot));
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--amber);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  z-index: 50;
  border: none;
  cursor: pointer;
}
.fab:active { transform: scale(0.95); }

/* ═══════ INSTALL PROMPT ═══════ */
.install-prompt {
  position: fixed;
  bottom: calc(20px + var(--safe-bot));
  left: 20px;
  right: 20px;
  max-width: 400px;
  margin: 0 auto;
  background: var(--navy);
  color: white;
  padding: 16px 20px;
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  z-index: 99;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideUp 0.3s;
}
.install-prompt-text { flex: 1; font-size: 13px; line-height: 1.4; }
.install-prompt-text strong { display: block; font-size: 14px; margin-bottom: 2px; }
.install-prompt-close {
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 20px;
  padding: 4px;
}

/* ═══════ TOAST ═══════ */
.toast-container {
  position: fixed;
  top: calc(20px + var(--safe-top));
  right: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: white;
  border-radius: 12px;
  padding: 12px 18px;
  box-shadow: var(--shadow-lg);
  border-left: 4px solid var(--green);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  animation: slideRight 0.3s;
  min-width: 240px;
  max-width: 360px;
  pointer-events: auto;
}

.toast--error { border-left-color: var(--red); }
.toast--info { border-left-color: var(--navy); }

@keyframes slideRight {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ═══════ TUTORIAL ═══════ */
.tutorial { max-width: 800px; }
.tutorial h2 {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  color: var(--navy);
  margin: 28px 0 12px;
  letter-spacing: -0.3px;
}
.tutorial h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--navy);
  margin: 20px 0 8px;
}
.tutorial p { margin-bottom: 12px; line-height: 1.7; }
.tutorial ul, .tutorial ol { margin: 8px 0 16px 24px; }
.tutorial li { margin-bottom: 8px; line-height: 1.6; }
.tutorial code {
  background: var(--light-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
}
.tutorial .info-box {
  background: var(--amber-bg);
  border-left: 4px solid var(--amber);
  padding: 16px 20px;
  margin: 16px 0;
  border-radius: 10px;
}
.tutorial .info-box-title {
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
  font-family: 'Fraunces', serif;
  font-size: 17px;
}

/* ═══════ PRINT LABEL ═══════ */
@media print {
  .sidebar, .mobile-bar, .no-print, .btn, .fab { display: none !important; }
  .main { padding: 0; }
  body { background: white; }
  .print-label { border: 2px solid black !important; box-shadow: none !important; }
}

.print-label {
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  overflow: hidden;
  max-width: 600px;
  margin: 0 auto;
}

.print-label-header {
  background: var(--navy);
  color: white;
  padding: 14px 20px;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
  letter-spacing: 0.5px;
}

.print-label-amber-line { height: 5px; background: var(--amber); }

.print-label-body {
  padding: 18px 20px;
  font-size: 13px;
  line-height: 1.7;
  color: #1A1F2E;
}

.print-label-cold {
  background: var(--navy);
  color: white;
  padding: 12px 20px;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
}

/* ═══════ RESPONSIVE ═══════ */
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: -270px;
    top: 0;
    width: 260px;
    transition: left 0.25s ease-out;
    box-shadow: var(--shadow-lg);
    z-index: 50;
  }
  .sidebar.open { left: 0; }
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 40;
    display: none;
  }
  .sidebar-overlay.open { display: block; }

  .mobile-bar { display: flex; }
  .main { padding: 16px; }
  .page-title { font-size: 26px; }
  .page-header { margin-bottom: 20px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .kpi { padding: 14px; }
  .kpi-value { font-size: 24px; }
  .kpi-label { font-size: 10px; }
  .kpi-detail { font-size: 11px; }
  .card, .table-wrap { border-radius: 12px; }
  .table th, .table td { padding: 10px 12px; }
  .modal { border-radius: 14px 14px 0 0; max-height: 95vh; align-self: flex-end; }
  .modal-bg { padding: 0; align-items: flex-end; }
  .form-grid { grid-template-columns: 1fr; gap: 14px; }
  .btn { padding: 12px 16px; }
}

@media (max-width: 380px) {
  .kpi-grid { grid-template-columns: 1fr; }
}

  color: rgba(255,255,255,0.7);

  padding: 8px 0;

function deepMergeDefaults(defaults, override) {
  if (override == null) return JSON.parse(JSON.stringify(defaults));
  if (Array.isArray(defaults) || typeof defaults !== 'object') return override;
  const out = {};
  for (const k of Object.keys(defaults)) {
    out[k] = (k in override) ? deepMergeDefaults(defaults[k], override[k]) : JSON.parse(JSON.stringify(defaults[k]));
  }
  for (const k of Object.keys(override)) {
    if (!(k in out)) out[k] = override[k];
  }
  return out;
}

let dataLoadError = false;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const fresh = JSON.parse(JSON.stringify(DEFAULT_DATA));
      fresh.meta.deviceId = 'dev-' + Math.random().toString(36).slice(2, 10);
      return fresh;
    }
    const parsed = JSON.parse(raw);
    const merged = deepMergeDefaults(DEFAULT_DATA, parsed);
    if (!merged.meta.deviceId) merged.meta.deviceId = 'dev-' + Math.random().toString(36).slice(2, 10);
    return merged;
  } catch(e) {
    console.error('Errore lettura dati:', e);
    dataLoadError = true;
    setTimeout(() => alert('⚠ Errore di caricamento dei dati locali.\n\nI salvataggi sono stati DISABILITATI per evitare di sovrascrivere il backup esistente.\n\nApri "Sincronizzazione" per ripristinare dal cloud Gist, oppure esporta il localStorage manualmente da DevTools.'), 100);
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData() {
  if (dataLoadError) {
    console.warn('saveData bloccato: errore caricamento iniziale dei dati');
    return;
  }
  try {
    data.meta.ultimoSalvataggio = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if (data.config.gistSync && data.config.gistSync.enabled && data.config.gistSync.autoSync) {
      scheduleGistUpload();
    }
  } catch(e) {
    toast('Errore nel salvataggio: ' + e.message, 'error');
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ════════════════════════════════════════════════════════════════════
   GITHUB GIST SYNC (cloud backup automatico)
   ════════════════════════════════════════════════════════════════════ */
const GIST_FILENAME = 'fornaio-data.json';
const GIST_CATALOGO = 'catalogo.json';
const GIST_ORDINI = 'ordini.json';
const GIST_CLIENTI_PUB = 'clienti-pubblico.json';
const GIST_API = 'https://api.github.com';

let gistUploadTimer = null;
let gistStatusState = { stato: 'idle', msg: '', ts: 0 };
let dailyBackupTimer = null;
let pollingOrdiniTimer = null;

function gistHeaders(pat) {
  return {
    'Authorization': 'token ' + pat,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json',
  };
}

async function gistCreate(pat, dati) {
  const body = {
    description: 'Brioche Lab Pro — Backup dati',
    public: false,
    files: {
      [GIST_FILENAME]: { content: JSON.stringify(dati, null, 2) }
    }
  };
  const r = await fetch(GIST_API + '/gists', { method: 'POST', headers: gistHeaders(pat), body: JSON.stringify(body) });
  if (!r.ok) throw new Error('Creazione Gist fallita: ' + r.status + ' ' + r.statusText);
  return r.json();
}

async function gistRead(gistId, pat) {
  const r = await fetch(GIST_API + '/gists/' + gistId, { headers: gistHeaders(pat) });
  if (!r.ok) throw new Error('Lettura Gist fallita: ' + r.status);
  return r.json();
}

async function gistPatchFiles(gistId, pat, files) {
  const r = await fetch(GIST_API + '/gists/' + gistId, { method: 'PATCH', headers: gistHeaders(pat), body: JSON.stringify({ files }) });
  if (!r.ok) throw new Error('Aggiornamento Gist fallito: ' + r.status);
  return r.json();
}

async function gistUploadDati() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.gistId || !cfg.pat) return;
  setGistStatus('syncing', 'Sincronizzazione in corso...');
  try {
    await gistPatchFiles(cfg.gistId, cfg.pat, {
      [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) }
    });
    cfg.lastUploadAt = new Date().toISOString();
    data.meta.ultimaSincronizzazione = cfg.lastUploadAt;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setGistStatus('synced', 'Sincronizzato');
    if (data.catalogo && data.catalogo.length) gistUploadCatalogoOrdiniClienti();
  } catch(e) {
    console.error('gistUploadDati:', e);
    setGistStatus('error', e.message);
  }
}

async function gistUploadCatalogoOrdiniClienti() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.gistId || !cfg.pat) return;
  try {
    const ordiniPubblici = (data.ordini || []).map(o => ({
      id: o.id, numero: o.numero, clienteId: o.clienteId, data: o.data, dataConsegna: o.dataConsegna,
      righe: o.righe, note: o.note, stato: o.stato, totale: o.totale, source: o.source || 'fornaio',
      createdAt: o.createdAt, updatedAt: o.updatedAt
    }));
    const clientiPub = (data.clienti || []).map(c => ({ id: c.id, nome: c.nome, ragioneSociale: c.ragioneSociale }));
    await gistPatchFiles(cfg.gistId, cfg.pat, {
      [GIST_CATALOGO]: { content: JSON.stringify(data.catalogo || [], null, 2) },
      [GIST_ORDINI]: { content: JSON.stringify(ordiniPubblici, null, 2) },
      [GIST_CLIENTI_PUB]: { content: JSON.stringify(clientiPub, null, 2) },
    });
  } catch(e) {
    console.error('gistUploadCatalogoOrdiniClienti:', e);
  }
}

function scheduleGistUpload() {
  if (gistUploadTimer) clearTimeout(gistUploadTimer);
  setGistStatus('pending', 'In attesa di sync...');
  gistUploadTimer = setTimeout(gistUploadDati, 30000);
}

function setGistStatus(stato, msg) {
  gistStatusState = { stato, msg, ts: Date.now() };
  updateGistBanner();
}

function gistStatusLabel() {
  const s = gistStatusState.stato;
  if (s === 'synced') {
    const cfg = data.config.gistSync;
    if (!cfg.lastUploadAt) return '✓ Sincronizzato';
    const diff = Date.now() - new Date(cfg.lastUploadAt).getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return '✓ Sincronizzato ora';
    if (min < 60) return `✓ Sincronizzato ${min} min fa`;
    const h = Math.floor(min / 60);
    return `✓ Sincronizzato ${h}h fa`;
  }
  if (s === 'syncing') return '🔄 Sincronizzazione...';
  if (s === 'pending') return '⏳ In attesa di sync';
  if (s === 'error') return '❌ ' + (gistStatusState.msg || 'Errore sync');
  if (s === 'offline') return '🟠 Offline';
  return '';
}

function updateGistBanner() {
  const el = document.getElementById('gistBanner');
  if (!el) return;
  const cfg = data.config.gistSync;
  if (!cfg.enabled) { el.style.display = 'none'; return; }
  el.style.display = '';
  const label = gistStatusLabel();
  const colorMap = { synced: 'var(--green)', syncing: 'var(--amber)', pending: 'var(--amber)', error: 'var(--red)', offline: 'var(--amber)', idle: 'var(--muted)' };
  const color = colorMap[gistStatusState.stato] || 'var(--muted)';
  el.innerHTML = `
    <span style="color:${color};font-weight:600">${escapeHtml(label)}</span>
    <span style="color:var(--muted);font-size:12px">· GitHub Gist</span>
    <button class="btn btn--ghost btn--small" style="margin-left:auto" onclick="gistManualSync()">Sync ora</button>
  `;
}

async function gistManualSync() {
  if (gistUploadTimer) { clearTimeout(gistUploadTimer); gistUploadTimer = null; }
  await gistUploadDati();
}

async function gistCheckOnBoot() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.gistId || !cfg.pat) return;
  try {
    const gist = await gistRead(cfg.gistId, cfg.pat);
    const file = gist.files[GIST_FILENAME];
    if (!file || !file.content) {
      setGistStatus('synced', '');
      return;
    }
    const cloudData = JSON.parse(file.content);
    const cloudTs = cloudData.meta?.ultimoSalvataggio || cloudData.config?.gistSync?.lastUploadAt || gist.updated_at;
    const localTs = data.meta.ultimoSalvataggio || '';
    if (cloudTs && (!localTs || new Date(cloudTs).getTime() > new Date(localTs).getTime() + 5000)) {
      const cloudDate = new Date(cloudTs);
      const ok = confirm(`I dati sul cloud sono più recenti.\n\n• Cloud: ${cloudDate.toLocaleString('it-IT')}\n• Locale: ${localTs ? new Date(localTs).toLocaleString('it-IT') : 'Mai'}\n\nVuoi ripristinare i dati dal cloud?\n\n(I tuoi dati locali verranno sostituiti.)`);
      if (ok) {
        data = deepMergeDefaults(DEFAULT_DATA, cloudData);
        if (!data.config.gistSync.pat) data.config.gistSync.pat = cfg.pat;
        if (!data.config.gistSync.gistId) data.config.gistSync.gistId = cfg.gistId;
        data.config.gistSync.enabled = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        setGistStatus('synced', '');
        render();
        toast('Dati ripristinati dal cloud', 'success');
      } else {
        setGistStatus('synced', '');
      }
    } else {
      setGistStatus('synced', '');
    }
    scheduleDailyBackupCatchup();
  } catch(e) {
    console.error('gistCheckOnBoot:', e);
    setGistStatus('error', e.message);
  }
}

async function gistConnect(pat) {
  if (!pat || !pat.trim()) { toast('Inserisci il PAT GitHub', 'error'); return; }
  pat = pat.trim();
  try {
    setGistStatus('syncing', 'Connessione in corso...');
    const cfg = data.config.gistSync;
    let gistId = cfg.gistId;
    if (gistId) {
      try {
        await gistRead(gistId, pat);
      } catch(e) {
        gistId = '';
      }
    }
    if (!gistId) {
      const created = await gistCreate(pat, data);
      gistId = created.id;
    } else {
      await gistPatchFiles(gistId, pat, { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } });
    }
    data.config.gistSync.pat = pat;
    data.config.gistSync.gistId = gistId;
    data.config.gistSync.enabled = true;
    data.config.gistSync.lastUploadAt = new Date().toISOString();
    saveData();
    setGistStatus('synced', '');
    toast('✓ Connesso a GitHub Gist', 'success');
    scheduleDailyBackup();
    render();
  } catch(e) {
    console.error('gistConnect:', e);
    setGistStatus('error', e.message);
    toast('Errore connessione: ' + e.message, 'error');
  }
}

function gistDisconnect() {
  if (!confirm('Disconnettere il sync GitHub Gist?\n\nIl Gist non verrà cancellato (puoi farlo manualmente su gist.github.com).\nI dati locali restano intatti.')) return;
  data.config.gistSync.enabled = false;
  data.config.gistSync.pat = '';
  if (gistUploadTimer) { clearTimeout(gistUploadTimer); gistUploadTimer = null; }
  if (dailyBackupTimer) { clearTimeout(dailyBackupTimer); dailyBackupTimer = null; }
  saveData();
  setGistStatus('idle', '');
  toast('Disconnesso da GitHub Gist', 'success');
  render();
}

/* ════════════════════════════════════════════════════════════════════
   BACKUP GIORNALIERO AUTOMATICO
   ════════════════════════════════════════════════════════════════════ */
function msToNextMidnight() {
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
  return tomorrow.getTime() - now.getTime();
}

function scheduleDailyBackup() {
  if (dailyBackupTimer) { clearTimeout(dailyBackupTimer); dailyBackupTimer = null; }
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.dailyBackup) return;
  const ms = msToNextMidnight();
  dailyBackupTimer = setTimeout(async () => {
    await doDailyBackup();
    scheduleDailyBackup();
  }, ms);
}

function scheduleDailyBackupCatchup() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.dailyBackup) return;
  const last = cfg.lastDailyBackupAt;
  if (!last) {
    doDailyBackup();
  } else {
    const diff = Date.now() - new Date(last).getTime();
    if (diff > 24 * 3600 * 1000) doDailyBackup();
  }
  scheduleDailyBackup();
}

async function doDailyBackup() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.gistId || !cfg.pat) return;
  try {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const filename = `backup-${yyyy}-${mm}-${dd}.json`;
    const files = { [filename]: { content: JSON.stringify(data, null, 2) } };
    const gist = await gistRead(cfg.gistId, cfg.pat);
    const backupFiles = Object.keys(gist.files).filter(n => /^backup-\d{4}-\d{2}-\d{2}\.json$/.test(n));
    backupFiles.sort();
    const retain = cfg.retainDays || 30;
    if (backupFiles.length >= retain) {
      const toDelete = backupFiles.slice(0, backupFiles.length - retain + 1);
      for (const fn of toDelete) {
        if (fn === filename) continue;
        files[fn] = null;
      }
    }
    await gistPatchFiles(cfg.gistId, cfg.pat, files);
    cfg.lastDailyBackupAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    toast('Backup giornaliero creato: ' + filename, 'success');
    if (document.querySelector('[data-page="sync"].active')) render();
  } catch(e) {
    console.error('doDailyBackup:', e);
    toast('Backup giornaliero fallito: ' + e.message, 'error');
  }
}

async function listGistBackups() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.gistId || !cfg.pat) return [];
  try {
    const gist = await gistRead(cfg.gistId, cfg.pat);
    return Object.keys(gist.files).filter(n => /^backup-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort().reverse();
  } catch(e) {
    console.error('listGistBackups:', e);
    return [];
  }
}

}

function copiaLinkCliente(url) {
  url = url.replace(/&#39;/g, "'");
  navigator.clipboard.writeText(url).then(() => toast('Link copiato negli appunti', 'success')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Link copiato', 'success');
  });
}

/* ════════════════════════════════════════════════════════════════════
   POLLING ORDINI DAI CLIENTI (notifiche in-app)
   ════════════════════════════════════════════════════════════════════ */
async function pollOrdiniClienti() {
  const cfg = data.config.gistSync;
  if (!cfg.enabled || !cfg.gistId || !cfg.pat) return;
  try {
    const gist = await gistRead(cfg.gistId, cfg.pat);
    const file = gist.files[GIST_ORDINI];
    if (!file || !file.content) return;
    const ordiniRemoti = JSON.parse(file.content);
    if (!Array.isArray(ordiniRemoti)) return;
    let cambiamenti = false;
    for (const remoto of ordiniRemoti) {
      if (remoto.source !== 'cliente-app') continue;
      const locale = (data.ordini || []).find(o => o.id === remoto.id);
      if (!locale) {
        data.ordini = data.ordini || [];
        data.ordini.push(remoto);
        const cli = data.clienti.find(c => c.id === remoto.clienteId);
        const nomeCliente = cli ? (cli.ragioneSociale || cli.nome) : 'Cliente';
        addNotifica('nuovo-ordine', 'Nuovo ordine da ' + nomeCliente, `Ordine per ${fmtDate(remoto.dataConsegna)} · ${(remoto.righe || []).length} prodotti · € ${fmtEur(remoto.totale || 0)}`, remoto.id);
        cambiamenti = true;
      } else if ((remoto.updatedAt || '') > (locale.updatedAt || '')) {
        Object.assign(locale, remoto);
        const cli = data.clienti.find(c => c.id === remoto.clienteId);
        const nomeCliente = cli ? (cli.ragioneSociale || cli.nome) : 'Cliente';
        addNotifica('modifica-ordine', 'Ordine modificato da ' + nomeCliente, `Ordine #${remoto.numero || remoto.id.slice(-6)} aggiornato`, remoto.id);
        cambiamenti = true;
      }
    }
    if (cambiamenti) {
      data.config.pollingOrdini.ultimoCheck = new Date().toISOString();
      saveData();
      if (currentPage === 'ordini' || currentPage === 'dashboard' || currentPage === 'notifiche') render();
    }
  } catch(e) {
    console.error('pollOrdiniClienti:', e);
  }
}

function startPollingOrdini() {
  if (pollingOrdiniTimer) clearInterval(pollingOrdiniTimer);
  if (!data.config.gistSync.enabled) return;
  pollingOrdiniTimer = setInterval(pollOrdiniClienti, 30000);
  setTimeout(pollOrdiniClienti, 2000);
}

async function restoreGistBackup(filename) {
  if (!confirm(`Ripristinare i dati dallo snapshot "${filename}"?\n\n⚠ I dati attuali verranno SOVRASCRITTI.\n\nUn backup di sicurezza dello stato attuale verrà creato prima.`)) return;
  const cfg = data.config.gistSync;
  try {
    setGistStatus('syncing', 'Ripristino in corso...');
    const safetyName = `pre-restore-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
    await gistPatchFiles(cfg.gistId, cfg.pat, { [safetyName]: { content: JSON.stringify(data, null, 2) } });
    const gist = await gistRead(cfg.gistId, cfg.pat);
    const file = gist.files[filename];
    if (!file || !file.content) throw new Error('Backup non trovato');
    const restored = JSON.parse(file.content);
    data = deepMergeDefaults(DEFAULT_DATA, restored);
    if (!data.config.gistSync.pat) data.config.gistSync.pat = cfg.pat;
    if (!data.config.gistSync.gistId) data.config.gistSync.gistId = cfg.gistId;
    data.config.gistSync.enabled = true;
    saveData();
    setGistStatus('synced', '');
    toast(`Dati ripristinati da ${filename}`, 'success', 5000);
    render();
  } catch(e) {
    console.error('restoreGistBackup:', e);
    setGistStatus('error', e.message);
    toast('Ripristino fallito: ' + e.message, 'error');
  }
}

/* ════════════════════════════════════════════════════════════════════
   LOT CODE GENERATOR
   ════════════════════════════════════════════════════════════════════ */
function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function generateLotCode(date, turno, prodottoCodice) {
  const yy = String(date.getFullYear()).slice(-2);
  const ddd = String(dayOfYear(date)).padStart(3, '0');
  const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const sameDay = data.lotti.filter(l =>
    l.data === dateStr && l.turno === turno && l.prodottoCodice === prodottoCodice
  );
  const nn = String(sameDay.length + 1).padStart(2, '0');
  return `L${yy}${ddd}${turno}-${prodottoCodice}-${nn}`;
}

function addMonths(date, months) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}

function fmtDate(d) {
  if (!d) return '—';
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const [y, m, g] = d.split('-').map(Number);
    return new Date(y, m - 1, g).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function oggiISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const g = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${g}`;
}

function isoOffset(giorni) {
  const d = new Date();
  d.setDate(d.getDate() + giorni);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const g = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${g}`;
}

function dataOggiLeggibile() {
  return new Date().toLocaleDateString('it-IT', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeXml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function fmtEur(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
}

function round2(n) {
  return Math.round((Number(n) || 0) * 100) / 100;
}

/* ════════════════════════════════════════════════════════════════════
   PRICING — Listino default + scaglioni per cliente
   ════════════════════════════════════════════════════════════════════ */
function getPrezzoCliente(clienteId, prodottoId, quantita) {
  const qta = parseInt(quantita) || 0;
  const cliente = data.clienti.find(c => c.id === clienteId);
  const prodotto = data.prodotti.find(p => p.id === prodottoId);
  if (!prodotto) return 0;

  if (cliente && Array.isArray(cliente.listino)) {
    const voce = cliente.listino.find(v => v.prodottoId === prodottoId);
    if (voce && Array.isArray(voce.scaglioni) && voce.scaglioni.length > 0) {
      const scaglioniOrdinati = [...voce.scaglioni].sort((a, b) => (a.minQta || 0) - (b.minQta || 0));
      let prezzo = null;
      for (const s of scaglioniOrdinati) {
        if (qta >= (s.minQta || 0)) prezzo = s.prezzo;
      }
      if (prezzo != null) return Number(prezzo) || 0;
    }
  }
  return Number(prodotto.prezzoDefault) || 0;
}

function generateOrdineNumero() {
  const anno = new Date().getFullYear();
  const sameYear = data.ordini.filter(o => (o.numero || '').includes(`-${anno}-`));
  const next = sameYear.length + 1;
  return `ORD-${anno}-${String(next).padStart(3, '0')}`;
}

function generateFatturaNumero() {
  const f = data.config.fatturazione;
  const anno = f.annoFiscale || new Date().getFullYear();
  const num = f.prossimoNumero || 1;
  return `${f.prefissoFattura || 'FT'}-${anno}-${String(num).padStart(3, '0')}`;
}

function migrateOrdiniStati() {
  let changed = false;
  (data.ordini || []).forEach(o => {
    if (['ricevuto', 'produzione', 'pronto'].includes(o.stato)) { o.stato = 'programmato'; changed = true; }
    else if (o.stato === 'spedito') { o.stato = 'consegnato'; changed = true; }
    else if (!o.stato) { o.stato = 'programmato'; changed = true; }
  });
  if (changed) saveData();
}

function statoOrdineLabel(stato) {
  const s = ORDINE_STATI.find(x => x.value === stato);
  return s ? s.label : stato;
}

function statoOrdinePill(stato) {
  const s = ORDINE_STATI.find(x => x.value === stato);

/* ════════════════════════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════════════════════════ */
function toast(message, type = 'success', duration = 3000) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.2s';
    setTimeout(() => el.remove(), 200);
  }, duration);
}

function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeLabel(saved);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  updateThemeLabel(next);
}

function updateThemeLabel(theme) {
  const label = document.getElementById('themeLabel');
  if (label) label.textContent = theme === 'light' ? 'Modalità scura' : 'Modalità chiara';
}

function loadKitchenMode() {
  if (localStorage.getItem(KITCHEN_KEY) === '1') {
    document.body.classList.add('kitchen-mode');
  }
}

function toggleKitchenMode() {
  document.body.classList.toggle('kitchen-mode');
  const isOn = document.body.classList.contains('kitchen-mode');
  localStorage.setItem(KITCHEN_KEY, isOn ? '1' : '0');
  toast(isOn ? 'Modalità cucina attiva (testo grande)' : 'Modalità cucina disattivata', 'info');
}

  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => {

  render();

    case 'fatturazione': main.innerHTML = renderFatturazione(); break;
    case 'guida': main.innerHTML = renderGuida(); break;
    case 'sync': main.innerHTML = renderSync(); break;
    case 'dati': main.innerHTML = renderDati(); break;
    case 'catalogo': main.innerHTML = renderCatalogo(); break;

    body: `

        <div class="form-grid">

              <option value="M" ${(lotto?.turno || turnoSuggerito)==='M'?'selected':''}>Mattina (M)</option>
              <option value="P" ${(lotto?.turno || turnoSuggerito)==='P'?'selected':''}>Pomeriggio (P)</option>
              <option value="N" ${(lotto?.turno || turnoSuggerito)==='N'?'selected':''}>Notte (N)</option>

            <label class="field-label">Quantità prodotta (pz)</label>
            <input type="number" class="field-input" name="quantita" value="${lotto?.quantita || ''}" min="1" required inputmode="numeric">

            <label class="field-label">Operatore</label>

          </div>
          <div class="field field--full">
            <label class="field-label">Materie prime utilizzate</label>
            <textarea class="field-textarea" name="materieUsate" placeholder="Es. Farina lotto F2024-187 (Molino Bianco), Burro lotto B45 (Galbani)...">${escapeHtml(lotto?.materieUsate || '')}</textarea>
            <div class="field-help">Indica i lotti delle materie prime per la tracciabilità a monte</div>
          </div>
          <div class="field field--full">
            <label class="field-label">Note</label>
            <textarea class="field-textarea" name="note" placeholder="Eventuali annotazioni">${escapeHtml(lotto?.note || '')}</textarea>
          </div>
        </div>
        ${lotto ? `<div class="lot-display" style="margin-top:20px">${lotto.codice}</div>` : ''}
      </form>
    `,
    footer: `
      <button class="btn btn--ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn--amber" onclick="saveLotto('${lottoId || ''}')">${lotto ? 'Salva modifiche' : 'Genera lotto'}</button>
    `
  });
}

function saveLotto(lottoId) {
  const form = document.getElementById('lottoForm');
  const fd = new FormData(form);
  const prodottoId = fd.get('prodottoId');
  if (!prodottoId) { toast('Seleziona un prodotto', 'error'); return; }
  const prodotto = data.prodotti.find(p => p.id === prodottoId);
  if (!prodotto) { toast('Prodotto non valido', 'error'); return; }
  const dateStr = fd.get('data');
  const date = new Date(dateStr);
  const turno = fd.get('turno');

  let lotto;
  if (lottoId) {
    lotto = data.lotti.find(l => l.id === lottoId);
  } else {
    const codice = generateLotCode(date, turno, prodotto.codice);
    lotto = { id: uid(), codice, createdAt: new Date().toISOString() };
    data.lotti.push(lotto);
  }

  lotto.data = dateStr;
  lotto.turno = turno;
  lotto.prodottoId = prodottoId;
  lotto.prodottoCodice = prodotto.codice;
  lotto.prodottoNome = prodotto.nome;
  lotto.quantita = parseInt(fd.get('quantita'));
  lotto.operatore = fd.get('operatore');
  lotto.materieUsate = fd.get('materieUsate');
  lotto.note = fd.get('note');
  const tmcDate = addMonths(date, prodotto.tmcMesi);
  lotto.tmc = `${tmcDate.getFullYear()}-${String(tmcDate.getMonth()+1).padStart(2,'0')}-${String(tmcDate.getDate()).padStart(2,'0')}`;

  if (lotto.operatore) {
    data.config.operatoreCorrente = lotto.operatore;
  }

  saveData();
  closeModal();
  render();
  toast(lottoId ? 'Lotto aggiornato' : `Lotto ${lotto.codice} creato`);
}

function deleteLotto(id) {
  const lotto = data.lotti.find(l => l.id === id);
  if (!lotto) return;
  const usato = data.spedizioni.some(s => s.lottoId === id);
  let msg = `Eliminare il lotto ${lotto.codice}?`;
  if (usato) msg = `Attenzione: ci sono spedizioni collegate al lotto ${lotto.codice}. Eliminare comunque?`;
  if (!confirm(msg)) return;
  data.lotti = data.lotti.filter(l => l.id !== id);
  saveData();
  render();
  toast('Lotto eliminato', 'info');
}

function printLabel(id) {
  const l = data.lotti.find(x => x.id === id);
  if (!l) return;
  const prodotto = data.prodotti.find(p => p.id === l.prodottoId);
  const pesoTot = prodotto ? prodotto.pesoPezzo * l.quantita : 0;

  showModal({
    title: 'Etichetta cartone',
    body: `

          ${escapeHtml(data.config.indirizzo)}<br>
          ${data.config.piva ? 'P. IVA: ' + escapeHtml(data.config.piva) : ''}
          <br><br>
          <strong>QUANTITÀ NETTA:</strong> ${l.quantita} pezzi × ${prodotto?.pesoPezzo || 0} g = ${pesoTot} g

          <strong>LOTTO:</strong> <span style="font-size:16px">${escapeHtml(l.codice)}</span><br>
          <strong>TMC:</strong> ${fmtDate(l.tmc)}
        </div>
        <div class="print-label-cold">

    footer: `

            <label class="field-label">Email</label>

function saveCliente(id) {

  c.ragioneSociale = fd.get('ragioneSociale');
  c.tipo = fd.get('tipo');
  c.piva = fd.get('piva');
  c.codiceFiscale = fd.get('codiceFiscale');
  c.indirizzo = fd.get('indirizzo');
  c.telefono = fd.get('telefono');
  c.email = fd.get('email');
  c.pec = fd.get('pec');
  c.codiceDestinatario = fd.get('codiceDestinatario');
  c.note = fd.get('note');
  saveData();
  closeModal();
  render();
  toast(id ? 'Cliente aggiornato' : 'Cliente aggiunto');
}

function deleteCliente(id) {
  if (!confirm('Eliminare questo cliente?')) return;
  data.clienti = data.clienti.filter(c => c.id !== id);
  saveData();
  render();
  toast('Cliente eliminato', 'info');
}

  const nextDdt = `DDT-${new Date().getFullYear()}-${String(data.spedizioni.length + 1).padStart(3, '0')}`;
  const clienteId = s?.clienteId || prefill?.clienteId || '';
  const lottoId = s?.lottoId || prefill?.lottoId || '';
  const quantita = s?.quantita || prefill?.quantita || '';
  const ordineId = s?.ordineId || prefill?.ordineId || '';
  const prezzoUnit = s?.prezzoUnitario ?? prefill?.prezzoUnitario ?? '';
  const note = s?.note || prefill?.note || '';
  showModal({
    title: s ? 'Modifica spedizione' : 'Nuova spedizione',
    body: `
      <form id="spedForm">
        ${prefill?.ordineNumero ? `
          <div class="banner banner--info">
            <div class="banner-icon">i</div>
            <div class="banner-content">
              <div class="banner-title">Spedizione da ordine ${escapeHtml(prefill.ordineNumero)}</div>
              <div>Dopo il salvataggio l'ordine passerà allo stato "Spedito".</div>
            </div>
          </div>
        ` : ''}
        <input type="hidden" name="ordineId" value="${escapeHtml(ordineId)}">
        <div class="form-grid">
          <div class="field">
            <label class="field-label">Data spedizione</label>
            <input type="date" class="field-input" name="data" value="${s?.data || oggi}" required>
          </div>
          <div class="field">
            <label class="field-label">Numero DDT</label>
            <input type="text" class="field-input mono" name="ddt" value="${escapeHtml(s?.ddt || nextDdt)}" required>
          </div>
          <div class="field field--full">
            <label class="field-label">Cliente</label>
            <select class="field-select" name="clienteId" required>
              <option value="">— Seleziona cliente —</option>
              ${data.clienti.map(c => `<option value="${c.id}" ${clienteId===c.id?'selected':''}>${escapeHtml(c.ragioneSociale)}</option>`).join('')}
            </select>
          </div>
          <div class="field field--full">
            <label class="field-label">Lotto spedito</label>
            <select class="field-select" name="lottoId" required>
              <option value="">— Seleziona lotto —</option>
              ${[...data.lotti].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(l => `<option value="${l.id}" ${lottoId===l.id?'selected':''}>${escapeHtml(l.codice)} — ${escapeHtml(l.prodottoNome)} (${l.quantita} pz)</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">Quantità (pz)</label>
            <input type="number" class="field-input" name="quantita" value="${quantita}" min="1" required inputmode="numeric">
          </div>
          <div class="field">
            <label class="field-label">Prezzo unitario (€)</label>
            <input type="number" class="field-input" name="prezzoUnitario" value="${prezzoUnit}" min="0" step="0.01" inputmode="decimal">
            <div class="field-help">Lasciato vuoto → calcolato dal listino del cliente</div>
          </div>
          <div class="field field--full">
            <label class="field-label">Note</label>
            <textarea class="field-textarea" name="note">${escapeHtml(note)}</textarea>
          </div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn--ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn--amber" onclick="saveSped('${id || ''}')">${s ? 'Salva' : 'Registra'}</button>
    `
  });
}

function saveSped(id) {
  const form = document.getElementById('spedForm');
  const fd = new FormData(form);
  const s = id ? data.spedizioni.find(x => x.id === id) : { id: uid() };
  if (!id) data.spedizioni.push(s);
  s.data = fd.get('data');
  s.ddt = fd.get('ddt');
  s.clienteId = fd.get('clienteId');
  s.lottoId = fd.get('lottoId');
  s.quantita = parseInt(fd.get('quantita'));
  s.note = fd.get('note');
  const ordineId = fd.get('ordineId');
  if (ordineId) s.ordineId = ordineId;
  const lotto = data.lotti.find(l => l.id === s.lottoId);
  if (lotto) s.prodottoId = lotto.prodottoId;
  const prezzoInserito = parseFloat(fd.get('prezzoUnitario'));
  if (!isNaN(prezzoInserito) && prezzoInserito >= 0) {
    s.prezzoUnitario = prezzoInserito;
  } else if (s.clienteId && s.prodottoId) {
    s.prezzoUnitario = getPrezzoCliente(s.clienteId, s.prodottoId, s.quantita);
  } else {
    s.prezzoUnitario = 0;
  }
  s.fatturaId = s.fatturaId || null;

  if (ordineId) {
    const ordine = data.ordini.find(o => o.id === ordineId);
    if (ordine) {
      ordine.ddtIds = ordine.ddtIds || [];
      if (!ordine.ddtIds.includes(s.id)) ordine.ddtIds.push(s.id);
      ordine.stato = 'consegnato';
      if (!ordine.consegnatoAt) ordine.consegnatoAt = new Date().toISOString();
    }
  }

  saveData();
  closeModal();
  render();
  toast(id ? 'Spedizione aggiornata' : 'Spedizione registrata');
}

function deleteSped(id) {
  if (!confirm('Eliminare questa spedizione?')) return;
  data.spedizioni = data.spedizioni.filter(s => s.id !== id);
  saveData();
  render();
  toast('Spedizione eliminata', 'info');
}

/* ════════════════════════════════════════════════════════════════════
   PAGE: ORDINI
   ════════════════════════════════════════════════════════════════════ */
let ordiniFilter = { search: '', clienteId: '', stato: '', giorno: '' };
let ordiniTab = 'oggi';

function totaleOrdine(o) {
  return (o.righe || []).reduce((s, r) => s + (parseFloat(r.prezzo) || 0) * (parseInt(r.quantita) || 0), 0);
}

function totaliPezziOrdine(o) {
  return (o.righe || []).reduce((s, r) => s + (parseInt(r.quantita) || 0), 0);
}

function inizialiCliente(c) {
  if (!c || !c.ragioneSociale) return '—';
  const parole = c.ragioneSociale.trim().split(/\s+/).filter(p => p.length > 0);
  if (parole.length === 0) return '—';
  if (parole.length === 1) return parole[0].slice(0, 2).toUpperCase();
  return (parole[0][0] + parole[1][0]).toUpperCase();
}

function renderOrdini() {
  return `
    <div class="page-header">
      <div>
        <div class="page-title">Ordini</div>
        <div class="page-subtitle"><strong style="text-transform:capitalize;color:var(--navy)">${dataOggiLeggibile()}</strong> · ${data.ordini.filter(o => o.dataConsegna === oggiISO() && o.stato === 'programmato').length} da consegnare oggi · ${data.ordini.length} totali</div>
      </div>
      <button class="btn btn--amber" onclick="openOrdineModal()" ${data.clienti.length===0?'disabled':''}>+ Nuovo ordine</button>
    </div>

    ${data.clienti.length === 0 ? `
      <div class="banner">
        <div class="banner-icon">!</div>
        <div class="banner-content">
          <div class="banner-title">Aggiungi prima un cliente</div>
          <div>Per registrare ordini devi avere almeno un cliente. <a href="#" onclick="navigateTo('clienti');return false;" style="color:var(--navy);font-weight:600">Vai a Clienti →</a></div>
        </div>
      </div>
    ` : ''}

    <div style="display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--grey-bord);flex-wrap:wrap">
      <button class="btn ${ordiniTab==='oggi'?'btn--amber':'btn--ghost'} btn--small" style="border-radius:8px 8px 0 0" onclick="ordiniTab='oggi';render()">🎯 Oggi</button>
      <button class="btn ${ordiniTab==='tabella'?'btn--amber':'btn--ghost'} btn--small" style="border-radius:8px 8px 0 0" onclick="ordiniTab='tabella';render()">📋 Tutti gli ordini (${data.ordini.length})</button>
    </div>

    ${ordiniTab === 'oggi' ? renderOrdiniOggi() : renderOrdiniTabella()}
  `;
}

function renderOrdiniOggi() {
  const oggi = oggiISO();
  if (data.clienti.length === 0) return '';

  // Mappa cliente → ordini di oggi
  const ordiniOggiByClient = {};
  data.ordini.forEach(o => {
    if (o.dataConsegna === oggi && (o.stato === 'programmato' || o.stato === 'consegnato')) {
      ordiniOggiByClient[o.clienteId] = ordiniOggiByClient[o.clienteId] || [];
      ordiniOggiByClient[o.clienteId].push(o);
    }
  });

  // Per ogni cliente, scegli lo stato "rappresentativo": se ha almeno un programmato → blu, altrimenti verde
  const clientiVerdi = []; // tutti consegnati
  const clientiBlu = [];   // almeno un programmato
  const clientiBianchi = []; // no ordini oggi

  data.clienti.forEach(c => {
    const ordini = ordiniOggiByClient[c.id];
    if (!ordini || ordini.length === 0) {
      clientiBianchi.push(c);
    } else if (ordini.every(o => o.stato === 'consegnato')) {
      clientiVerdi.push({ cliente: c, ordini });
    } else {
      clientiBlu.push({ cliente: c, ordini });
    }
  });

  // Ordinamento blu per orario crescente (ordini programmati)
  clientiBlu.sort((a, b) => {
    const oraA = a.ordini.filter(o => o.stato === 'programmato').map(o => o.oraConsegna || '99:99').sort()[0] || '99:99';
    const oraB = b.ordini.filter(o => o.stato === 'programmato').map(o => o.oraConsegna || '99:99').sort()[0] || '99:99';
    return oraA.localeCompare(oraB);
  });
  // Verdi per orario di consegna (più recente prima)
  clientiVerdi.sort((a, b) => {
    const tsA = a.ordini.map(o => o.consegnatoAt || '').sort().reverse()[0] || '';
    const tsB = b.ordini.map(o => o.consegnatoAt || '').sort().reverse()[0] || '';
    return tsB.localeCompare(tsA);
  });
  // Bianchi alfabetico
  clientiBianchi.sort((a, b) => (a.ragioneSociale || '').localeCompare(b.ragioneSociale || ''));

  return `
    <div class="cliente-sezione cliente-sezione--verde">
      <div class="cliente-sezione-h">
        🟢 Consegnati oggi <span class="badge">${clientiVerdi.length}</span>
      </div>
      ${clientiVerdi.length === 0 ? `
        <div style="padding:14px;color:var(--muted);font-style:italic;font-size:13px">Nessuna consegna ancora completata oggi.</div>
      ` : `
        <div class="cliente-grid">
          ${clientiVerdi.map(({cliente, ordini}) => clienteCardHTML(cliente, ordini, 'verde')).join('')}
        </div>
      `}
    </div>

    <div class="cliente-sezione cliente-sezione--blu">
      <div class="cliente-sezione-h">
        🔵 Da consegnare oggi <span class="badge">${clientiBlu.length}</span>
      </div>
      ${clientiBlu.length === 0 ? `
        <div style="padding:14px;color:var(--muted);font-style:italic;font-size:13px">Tutti gli ordini di oggi sono stati consegnati! 🎉</div>
      ` : `
        <div class="cliente-grid">
          ${clientiBlu.map(({cliente, ordini}) => clienteCardHTML(cliente, ordini, 'blu')).join('')}
        </div>
      `}
    </div>

    <div class="cliente-sezione cliente-sezione--bianco">
      <div class="cliente-sezione-h">
        ⚪ Altri clienti (no ordine oggi) <span class="badge">${clientiBianchi.length}</span>
      </div>
      ${clientiBianchi.length === 0 ? `
        <div style="padding:14px;color:var(--muted);font-style:italic;font-size:13px">Tutti i clienti hanno un ordine oggi.</div>
      ` : `
        <div class="cliente-grid">
          ${clientiBianchi.map(c => clienteCardHTML(c, [], 'bianco')).join('')}
        </div>
      `}
    </div>
  `;
}

function clienteCardHTML(cliente, ordiniOggi, variante) {
  const iniziali = inizialiCliente(cliente);
  const nome = escapeHtml(cliente.ragioneSociale || '—');
  let info = '';

  if (variante === 'verde') {
    const orari = ordiniOggi.map(o => o.consegnatoAt ? new Date(o.consegnatoAt).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}) : (o.oraConsegna || '')).filter(x => x);
    const note = ordiniOggi.map(o => o.noteConsegna).filter(n => n && n.trim()).join(' · ');
    info = `
      <div class="cliente-info">
        ${orari.length > 0 ? `<div class="orario">✓ ${escapeHtml(orari.join(' · '))}</div>` : '<div class="orario">✓ Consegnato</div>'}
        ${note ? `<div class="nota" title="${escapeHtml(note)}">"${escapeHtml(note)}"</div>` : ''}
      </div>
    `;
  } else if (variante === 'blu') {
    const ordiniProg = ordiniOggi.filter(o => o.stato === 'programmato');
    const orari = ordiniProg.map(o => o.oraConsegna).filter(x => x);
    const totPezzi = ordiniProg.reduce((s, o) => s + totaliPezziOrdine(o), 0);
    const totEur = ordiniProg.reduce((s, o) => s + totaleOrdine(o), 0);
    info = `
      <div class="cliente-info">
        <div class="orario">⏰ ${orari.length > 0 ? escapeHtml(orari.sort().join(' · ')) : 'Senza orario'}</div>
        <div><strong>${totPezzi}</strong> pz${totEur > 0 ? ` · ${fmtEur(totEur)}` : ''}</div>
      </div>
    `;
  }

  return `
    <div class="cliente-card cliente-card--${variante}" onclick="apriSchedaOrdineCliente('${cliente.id}')">
      <div class="cliente-avatar">
        ${iniziali}
        ${variante === 'verde' ? '<span class="check-badge">✓</span>' : ''}
      </div>
      <div class="cliente-nome">${nome}</div>
      ${info}
    </div>
  `;
}

function applicaFiltriOrdini(ordini) {
  if (ordiniFilter.search) {
    const q = ordiniFilter.search.toLowerCase();
    ordini = ordini.filter(o => {
      const cliente = data.clienti.find(c => c.id === o.clienteId);
      return (o.numero || '').toLowerCase().includes(q) ||
             (cliente?.ragioneSociale || '').toLowerCase().includes(q) ||
             (o.note || '').toLowerCase().includes(q);
    });
  }
  if (ordiniFilter.clienteId) ordini = ordini.filter(o => o.clienteId === ordiniFilter.clienteId);
  if (ordiniFilter.stato) ordini = ordini.filter(o => o.stato === ordiniFilter.stato);
  return ordini;
}

function righeOrdineTabellaHTML(ordini, mostraData) {
  const oggi = oggiISO();
  return ordini.map(o => {
    const cliente = data.clienti.find(c => c.id === o.clienteId);
    const totale = totaleOrdine(o);
    const consegnaOggi = o.dataConsegna === oggi;
    const inRitardo = o.dataConsegna && o.dataConsegna < oggi && o.stato === 'programmato';
    return `
      <tr style="cursor:pointer" onclick="if(!event.target.closest('button'))openOrdineModal('${o.id}')">
        <td class="mono"><strong>${escapeHtml(o.numero || '—')}</strong></td>
        <td>${escapeHtml(cliente?.ragioneSociale || '— eliminato —')}</td>
        ${mostraData ? `
          <td>
            ${o.dataConsegna ? `<strong style="color:${inRitardo?'var(--red)':consegnaOggi?'var(--amber-dark)':'inherit'}">${fmtDate(o.dataConsegna)}</strong>` : '—'}
            ${o.oraConsegna ? `<span style="color:var(--muted);font-size:12px"> · ${o.oraConsegna}</span>` : ''}
          </td>
        ` : `
          <td>${o.oraConsegna ? `<strong>${escapeHtml(o.oraConsegna)}</strong>` : '<span style="color:var(--muted)">—</span>'}</td>
        `}
        <td>${(o.righe || []).length}</td>
        <td><strong>${fmtEur(totale)}</strong></td>
        <td>${statoOrdinePill(o.stato)}</td>
        <td>
          <div class="table-actions">
            ${o.stato === 'nuovo' ? `<button class="btn btn--amber btn--small" onclick="event.stopPropagation();confermaNuovoOrdine('${o.id}')" title="Conferma">✓</button>` : ''}
            ${o.stato === 'programmato' ? `<button class="btn btn--amber btn--small" onclick="event.stopPropagation();segnaConsegnato('${o.id}')" title="Segna consegnato">✓</button>` : ''}
            <button class="btn btn--ghost btn--small" onclick="event.stopPropagation();openOrdineModal('${o.id}')">Mod.</button>
            <button class="btn btn--danger btn--small" onclick="event.stopPropagation();deleteOrdine('${o.id}')">×</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function sezioneOrdiniHTML(titolo, ordini, opts) {
  opts = opts || {};
  const mostraData = !!opts.mostraData;
  const klassExtra = opts.klass || '';
  const colonnaData = mostraData ? '<th>Data consegna</th>' : '<th>Ora</th>';
  return `
    <div class="cliente-sezione ${klassExtra}" style="margin-bottom:22px">
      <div class="cliente-sezione-h">
        ${titolo} <span class="badge">${ordini.length}</span>
      </div>
      ${ordini.length === 0 ? `
        <div style="padding:14px;color:var(--muted);font-style:italic;font-size:13px">Nessun ordine programmato per questo giorno.</div>
      ` : `
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Numero</th>
                <th>Cliente</th>
                ${colonnaData}
                <th>Righe</th>
                <th>Totale</th>
                <th>Stato</th>
                <th></th>
              </tr>
            </thead>
            <tbody>${righeOrdineTabellaHTML(ordini, mostraData)}</tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function renderOrdiniTabella() {
  const oggi = oggiISO();
  const domani = isoOffset(1);
  const dopodomani = isoOffset(2);

  const filtri = `
    <div class="card" style="margin-bottom:20px">
      <div class="form-grid">
        <div class="field">
          <label class="field-label">Cerca</label>
          <input type="text" class="field-input" placeholder="Numero, cliente, note..."
            value="${escapeHtml(ordiniFilter.search)}" oninput="ordiniFilter.search=this.value;render()">
        </div>
        <div class="field">
          <label class="field-label">Cliente</label>
          <select class="field-select" onchange="ordiniFilter.clienteId=this.value;render()">
            <option value="">Tutti</option>
            ${data.clienti.map(c => `<option value="${c.id}" ${ordiniFilter.clienteId===c.id?'selected':''}>${escapeHtml(c.ragioneSociale)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Stato</label>
          <select class="field-select" onchange="ordiniFilter.stato=this.value;render()">
            <option value="">Tutti</option>
            ${ORDINE_STATI.map(s => `<option value="${s.value}" ${ordiniFilter.stato===s.value?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Vai a un giorno specifico</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="date" class="field-input" value="${escapeHtml(ordiniFilter.giorno)}"
              onchange="ordiniFilter.giorno=this.value;render()" style="flex:1">
            ${ordiniFilter.giorno ? `<button class="btn btn--ghost btn--small" onclick="ordiniFilter.giorno='';render()" title="Mostra tutti">×</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;

  if (data.ordini.length === 0) {
    return filtri + `
      <div class="card empty">
        <div class="empty-icon">📋</div>
        <div class="empty-title">Nessun ordine registrato</div>
        <div class="empty-text">Registra ogni ordine ricevuto: ti aiuta a pianificare le consegne.</div>
        ${data.clienti.length > 0 ? `<button class="btn btn--amber" onclick="openOrdineModal()">Crea il primo ordine</button>` : ''}
      </div>
    `;
  }

  // Vista singolo giorno (date picker attivo)
  if (ordiniFilter.giorno) {
    const ordGiorno = applicaFiltriOrdini(data.ordini.filter(o => o.dataConsegna === ordiniFilter.giorno))
      .sort((a, b) => (a.oraConsegna || '99:99').localeCompare(b.oraConsegna || '99:99'));
    const labelGiorno = `📅 ${formattaLabelGiorno(ordiniFilter.giorno)}`;
    return filtri + sezioneOrdiniHTML(labelGiorno, ordGiorno, { mostraData: false });
  }

  // Vista 4 sezioni (Oggi/Domani/Dopodomani/Prossimi)
  const ordini = applicaFiltriOrdini([...data.ordini]);
  const sortByOra = (a, b) => (a.oraConsegna || '99:99').localeCompare(b.oraConsegna || '99:99');
  const ordOggi       = ordini.filter(o => o.dataConsegna === oggi).sort(sortByOra);
  const ordDomani     = ordini.filter(o => o.dataConsegna === domani).sort(sortByOra);
  const ordDopodomani = ordini.filter(o => o.dataConsegna === dopodomani).sort(sortByOra);
  const ordProssimi   = ordini.filter(o => o.dataConsegna > dopodomani)
    .sort((a, b) => ((a.dataConsegna || '') + (a.oraConsegna || '')).localeCompare((b.dataConsegna || '') + (b.oraConsegna || '')));

  const fmtPrima = (iso) => {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
  };

  return filtri +
    sezioneOrdiniHTML(`🌅 Oggi · ${fmtPrima(oggi)}`, ordOggi, { mostraData: false, klass: 'cliente-sezione--bianco' }) +
    sezioneOrdiniHTML(`☀ Domani · ${fmtPrima(domani)}`, ordDomani, { mostraData: false, klass: 'cliente-sezione--verde' }) +
    sezioneOrdiniHTML(`⏭ Dopodomani · ${fmtPrima(dopodomani)}`, ordDopodomani, { mostraData: false, klass: 'cliente-sezione--blu' }) +
    sezioneOrdiniHTML(`📅 Prossimi (dal ${fmtPrima(isoOffset(3))})`, ordProssimi, { mostraData: true });
}

function formattaLabelGiorno(isoDate) {
  if (!isoDate) return '—';
  const oggi = oggiISO();
  const domani = isoOffset(1);
  if (isoDate === oggi) return 'OGGI · ' + fmtDate(isoDate);
  if (isoDate === domani) return 'DOMANI · ' + fmtDate(isoDate);
  try {
    const d = new Date(isoDate + 'T00:00:00');
    const giorni = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
    return `${giorni[d.getDay()]} · ${fmtDate(isoDate)}`;
  } catch(e) {
    return fmtDate(isoDate);
  }
}

function apriSchedaOrdineCliente(clienteId) {
  const cliente = data.clienti.find(c => c.id === clienteId);
  if (!cliente) return;
  const oggi = oggiISO();
  const limite30gg = isoOffset(30);
  const ordini = data.ordini.filter(o => o.clienteId === clienteId);

  const programmatiOggi = ordini.filter(o => o.stato === 'programmato' && o.dataConsegna === oggi);
  const futuri = ordini.filter(o => o.stato === 'programmato' && o.dataConsegna > oggi && o.dataConsegna <= limite30gg)
    .sort((a, b) => (a.dataConsegna + (a.oraConsegna || '')).localeCompare(b.dataConsegna + (b.oraConsegna || '')));
  const consegnatiOggi = ordini.filter(o => o.stato === 'consegnato' && o.dataConsegna === oggi);
  const storico = ordini.filter(o => (o.stato === 'consegnato' || o.stato === 'annullato') && o.dataConsegna !== oggi)
    .sort((a, b) => (b.dataConsegna || '').localeCompare(a.dataConsegna || ''))
    .slice(0, 20);

  // raggruppa futuri per giorno
  const futuriByGiorno = {};
  futuri.forEach(o => {
    futuriByGiorno[o.dataConsegna] = futuriByGiorno[o.dataConsegna] || [];
    futuriByGiorno[o.dataConsegna].push(o);
  });

  const ordineMiniHTML = (o, mostraConsegna) => {
    const klass = o.stato === 'consegnato' ? 'ordine-mini-card--consegnato' : o.stato === 'annullato' ? 'ordine-mini-card--annullato' : '';
    const righeText = (o.righe || []).map(r => {
      const p = data.prodotti.find(x => x.id === r.prodottoId);
      return `${r.quantita} × ${escapeHtml(p?.nome || '—')}`;
    }).join('<br>');
    const tot = totaleOrdine(o);
    return `
      <div class="ordine-mini-card ${klass}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="font-weight:700;color:var(--navy);margin-bottom:4px">
              ${o.oraConsegna ? `⏰ ${escapeHtml(o.oraConsegna)}` : '⏰ Senza orario'}
              ${o.stato === 'consegnato' ? `<span style="color:var(--green);margin-left:8px">✓ Consegnato</span>` : ''}
            </div>
            <div style="font-size:13px;line-height:1.5">${righeText || '<em style="color:var(--muted)">Nessuna riga</em>'}</div>
            ${tot > 0 ? `<div style="font-size:13px;color:var(--muted);margin-top:4px">Tot: <strong style="color:var(--navy)">${fmtEur(tot)}</strong></div>` : ''}
            ${o.noteConsegna ? `<div style="font-size:12px;color:var(--green);margin-top:4px;font-style:italic">Nota: ${escapeHtml(o.noteConsegna)}</div>` : ''}
            ${o.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;font-style:italic">${escapeHtml(o.note)}</div>` : ''}
          </div>
          <div class="table-actions" style="flex-shrink:0">
            ${o.stato === 'nuovo' ? `<button class="btn btn--amber btn--small" onclick="confermaNuovoOrdine('${o.id}')">✓ Conferma</button>` : ''}
            ${o.stato === 'programmato' && mostraConsegna ? `<button class="btn btn--amber btn--small" onclick="segnaConsegnato('${o.id}')">✓ Consegnato</button>` : ''}
            ${o.stato === 'consegnato' ? `<button class="btn btn--ghost btn--small" onclick="riapriOrdine('${o.id}')" title="Annulla consegna">↶</button>` : ''}
            <button class="btn btn--ghost btn--small" onclick="openOrdineModal('${o.id}')">Mod.</button>
            <button class="btn btn--danger btn--small" onclick="deleteOrdine('${o.id}', true)">×</button>
          </div>
        </div>
      </div>
    `;
  };

  showModal({
    title: cliente.ragioneSociale,
    body: `
      <div style="color:var(--muted);font-size:13px;margin-bottom:18px;display:flex;gap:14px;flex-wrap:wrap">
        ${cliente.telefono ? `<span>📞 ${escapeHtml(cliente.telefono)}</span>` : ''}
        ${cliente.email ? `<span>📧 ${escapeHtml(cliente.email)}</span>` : ''}
        ${cliente.indirizzo ? `<span>📍 ${escapeHtml(cliente.indirizzo)}</span>` : ''}
      </div>

      ${(programmatiOggi.length + consegnatiOggi.length) > 0 ? `
        <div class="ordini-giorno-h">${formattaLabelGiorno(oggi)}</div>
        ${programmatiOggi.map(o => ordineMiniHTML(o, true)).join('')}
        ${consegnatiOggi.map(o => ordineMiniHTML(o, false)).join('')}
      ` : ''}

      ${Object.keys(futuriByGiorno).sort().map(g => `
        <div class="ordini-giorno-h">${formattaLabelGiorno(g)}</div>
        ${futuriByGiorno[g].map(o => ordineMiniHTML(o, false)).join('')}
      `).join('')}

      ${(programmatiOggi.length + consegnatiOggi.length + futuri.length) === 0 ? `
        <div style="text-align:center;padding:20px;color:var(--muted);font-style:italic">Nessun ordine pendente per questo cliente.</div>
      ` : ''}

      <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--grey-bord)">
        <button class="btn btn--amber" style="width:100%" onclick="closeModal();openOrdineModal(null, {clienteId:'${cliente.id}'})">+ Nuovo ordine per questo cliente</button>
      </div>

      ${storico.length > 0 ? `
        <details style="margin-top:18px">
          <summary style="cursor:pointer;font-weight:600;color:var(--muted);padding:8px 0">▸ Storico ultimi ordini (${storico.length})</summary>
          <div style="margin-top:10px;display:grid;gap:6px;font-size:13px">
            ${storico.map(o => {
              const orarioCons = o.consegnatoAt ? new Date(o.consegnatoAt).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : (o.oraConsegna || '—');
              const stato = o.stato === 'consegnato' ? '✓' : '✗';
              return `<div style="padding:8px 12px;background:var(--light-bg);border-radius:6px;cursor:pointer" onclick="closeModal();openOrdineModal('${o.id}')">
                <strong>${fmtDate(o.dataConsegna)}</strong> ${stato} ${orarioCons} · ${totaliPezziOrdine(o)} pz · ${fmtEur(totaleOrdine(o))}
                ${o.noteConsegna ? `<div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:2px">${escapeHtml(o.noteConsegna)}</div>` : ''}
              </div>`;
            }).join('')}
          </div>
        </details>
      ` : ''}
    `,
    footer: `<button class="btn btn--ghost" onclick="closeModal()">Chiudi</button>`
  });
}

function confermaNuovoOrdine(ordineId) {
  const o = data.ordini.find(x => x.id === ordineId);
  if (!o) return;
  o.stato = 'programmato';
  o.confermatoAt = new Date().toISOString();
  o.updatedAt = new Date().toISOString();
  saveData();
  gistUploadCatalogoOrdiniClienti();
  render();
  const cliente = data.clienti.find(c => c.id === o.clienteId);
  toast(`✓ Ordine confermato per ${cliente?.ragioneSociale || 'cliente'}`);
}

function segnaConsegnato(ordineId) {
  const o = data.ordini.find(x => x.id === ordineId);
  if (!o) return;
  const cliente = data.clienti.find(c => c.id === o.clienteId);
  showModal({
    title: `✓ Segna consegnato`,
    body: `
      <div style="margin-bottom:14px">
        <div style="color:var(--muted);font-size:13px">Cliente</div>
        <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--navy);font-weight:600">${escapeHtml(cliente?.ragioneSociale || '—')}</div>
        <div style="color:var(--muted);font-size:13px;margin-top:6px">${(o.righe || []).length} righe · ${totaliPezziOrdine(o)} pezzi · ${fmtEur(totaleOrdine(o))}</div>
      </div>
      <form id="consegnaForm">
        <div class="field">
          <label class="field-label">Nota di consegna (opzionale)</label>
          <textarea class="field-textarea" name="nota" placeholder="Es. lasciato in dispensa lato cortile, mancavano 5 cornetti, ecc." style="min-height:80px"></textarea>
          <div class="field-help">Resterà visibile sulla card e nello storico</div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn--ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn--amber" onclick="confermaConsegnato('${ordineId}')">✓ Segna consegnato</button>
    `
  });
}

function confermaConsegnato(ordineId) {
  const o = data.ordini.find(x => x.id === ordineId);
  if (!o) return;
  const form = document.getElementById('consegnaForm');
  const nota = form ? form.querySelector('[name="nota"]').value : '';
  o.stato = 'consegnato';
  o.consegnatoAt = new Date().toISOString();
  o.updatedAt = new Date().toISOString();
  o.noteConsegna = (nota || '').trim();
  saveData();
  gistUploadCatalogoOrdiniClienti();
  closeModal();
  render();
  const cliente = data.clienti.find(c => c.id === o.clienteId);
  toast(`✓ Consegnato a ${cliente?.ragioneSociale || 'cliente'}`);
}

function riapriOrdine(ordineId) {
  const o = data.ordini.find(x => x.id === ordineId);
  if (!o) return;
  if (!confirm(`Annullare la consegna dell'ordine ${o.numero}? Tornerà nello stato "Da consegnare".`)) return;
  o.stato = 'programmato';
  o.consegnatoAt = null;
  o.noteConsegna = '';
  o.updatedAt = new Date().toISOString();
  saveData();
  gistUploadCatalogoOrdiniClienti();
  closeModal();
  render();
  toast('Ordine riportato in "Da consegnare"', 'info');
}

function ordineRigaHTML(idx, riga) {
  const opts = data.prodotti.map(p => `<option value="${p.id}" ${riga?.prodottoId===p.id?'selected':''}>${escapeHtml(p.nome)} (${p.codice})</option>`).join('');
  return `
    <div class="ord-riga" data-idx="${idx}" style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px;padding:10px;background:var(--light-bg);border-radius:8px">
      <div class="field" style="margin:0">
        <label class="field-label" style="font-size:10px">Prodotto</label>
        <select class="field-select" name="prodottoId" onchange="onOrdineRigaChange(${idx})">
          <option value="">— Seleziona —</option>
          ${opts}
        </select>
      </div>
      <div class="field" style="margin:0">
        <label class="field-label" style="font-size:10px">Quantità</label>
        <input type="number" class="field-input" name="quantita" value="${riga?.quantita || ''}" min="1" inputmode="numeric" oninput="onOrdineRigaChange(${idx})">
      </div>
      <div class="field" style="margin:0">
        <label class="field-label" style="font-size:10px">Prezzo unit. €</label>
        <input type="number" class="field-input" name="prezzo" value="${riga?.prezzo ?? ''}" min="0" step="0.01" inputmode="decimal" oninput="aggiornaTotaleOrdine()">
      </div>
      <div class="field" style="margin:0">
        <label class="field-label" style="font-size:10px">Subtot.</label>
        <input type="text" class="field-input mono" name="subtot" value="${riga?.prezzo && riga?.quantita ? fmtEur(riga.prezzo * riga.quantita) : '—'}" readonly>
      </div>
      <button type="button" class="btn btn--danger btn--small" onclick="rimuoviRigaOrdine(${idx})" title="Rimuovi riga">×</button>
    </div>
  `;
}

let ordineDraftRighe = [];

function onOrdineRigaChange(idx) {
  const form = document.getElementById('ordineForm');
  if (!form) return;
  const clienteId = form.querySelector('[name="clienteId"]').value;
  const righe = form.querySelectorAll('.ord-riga');
  const riga = righe[idx];
  if (!riga) return;
  const prodottoId = riga.querySelector('[name="prodottoId"]').value;
  const quantita = parseInt(riga.querySelector('[name="quantita"]').value) || 0;
  if (clienteId && prodottoId && quantita > 0) {
    const prezzoInput = riga.querySelector('[name="prezzo"]');
    if (!prezzoInput.dataset.touched) {
      prezzoInput.value = getPrezzoCliente(clienteId, prodottoId, quantita).toFixed(2);
    }
  }
  aggiornaTotaleOrdine();
}

function aggiornaTotaleOrdine() {
  const form = document.getElementById('ordineForm');
  if (!form) return;
  let tot = 0;
  form.querySelectorAll('.ord-riga').forEach(r => {
    const q = parseInt(r.querySelector('[name="quantita"]').value) || 0;
    const p = parseFloat(r.querySelector('[name="prezzo"]').value) || 0;
    const sub = q * p;
    r.querySelector('[name="subtot"]').value = sub > 0 ? fmtEur(sub) : '—';
    tot += sub;
  });
  const totEl = document.getElementById('ordineTotale');
  if (totEl) totEl.textContent = fmtEur(tot);
  form.querySelectorAll('[name="prezzo"]').forEach(inp => {
    inp.addEventListener('input', () => { inp.dataset.touched = '1'; }, { once: true });
  });
}

function aggiungiRigaOrdine() {
  ordineDraftRighe.push({ prodottoId: '', quantita: '', prezzo: '' });
  rerenderOrdineRighe();
}

function rimuoviRigaOrdine(idx) {
  const form = document.getElementById('ordineForm');
  if (!form) return;
  ordineDraftRighe = leggiRigheDaForm();
  ordineDraftRighe.splice(idx, 1);
  rerenderOrdineRighe();
}

function leggiRigheDaForm() {
  const form = document.getElementById('ordineForm');
  if (!form) return [];
  return Array.from(form.querySelectorAll('.ord-riga')).map(r => ({
    prodottoId: r.querySelector('[name="prodottoId"]').value,
    quantita: parseInt(r.querySelector('[name="quantita"]').value) || 0,
    prezzo: parseFloat(r.querySelector('[name="prezzo"]').value) || 0,
  }));
}

function rerenderOrdineRighe() {
  const cont = document.getElementById('ordineRighe');
  if (!cont) return;
  cont.innerHTML = ordineDraftRighe.map((r, i) => ordineRigaHTML(i, r)).join('');
  aggiornaTotaleOrdine();
}

function openOrdineModal(id, prefill) {
  const o = id ? data.ordini.find(x => x.id === id) : null;
  const oggi = oggiISO();
  ordineDraftRighe = o ? [...(o.righe || [])] : [];
  if (ordineDraftRighe.length === 0) ordineDraftRighe.push({ prodottoId: '', quantita: '', prezzo: '' });
  const clienteIdInit = o?.clienteId || prefill?.clienteId || '';
  const dataConsegnaInit = o?.dataConsegna || prefill?.dataConsegna || oggi;

  showModal({
    title: o ? `Modifica ordine ${o.numero}` : 'Nuovo ordine',
    body: `
      <form id="ordineForm">
        <div class="form-grid">
          <div class="field">
            <label class="field-label">Data ordine</label>
            <input type="date" class="field-input" name="data" value="${o?.data || oggi}" required>
          </div>
          <div class="field">
            <label class="field-label">Numero ordine</label>
            <input type="text" class="field-input mono" name="numero" value="${escapeHtml(o?.numero || generateOrdineNumero())}" required>
          </div>
          <div class="field field--full">
            <label class="field-label">Cliente</label>
            <select class="field-select" name="clienteId" required onchange="onOrdineRigaChange(0)">
              <option value="">— Seleziona cliente —</option>
              ${data.clienti.map(c => `<option value="${c.id}" ${clienteIdInit===c.id?'selected':''}>${escapeHtml(c.ragioneSociale)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">Data consegna</label>
            <input type="date" class="field-input" name="dataConsegna" value="${dataConsegnaInit}" required>
          </div>

function saveOrdine(id) {
  const form = document.getElementById('ordineForm');
  const fd = new FormData(form);
  const clienteId = fd.get('clienteId');
  if (!clienteId) { toast('Seleziona un cliente', 'error'); return; }
  const dataConsegna = fd.get('dataConsegna');
  if (!dataConsegna) { toast('Inserisci la data di consegna', 'error'); return; }

  const righe = leggiRigheDaForm().filter(r => r.prodottoId && r.quantita > 0);
  if (righe.length === 0) { toast('Aggiungi almeno una riga valida', 'error'); return; }

  let o = id ? data.ordini.find(x => x.id === id) : null;
  const isNew = !o;
  if (!o) {
    o = { id: uid(), createdAt: new Date().toISOString(), ddtIds: [], consegnatoAt: null, noteConsegna: '' };
    data.ordini.push(o);
  }
  o.numero = fd.get('numero');
  o.data = fd.get('data');
  o.clienteId = clienteId;
  o.dataConsegna = dataConsegna;
  o.oraConsegna = fd.get('oraConsegna');
  const nuovoStato = fd.get('stato') || 'programmato';
  if (o.stato !== 'consegnato' && nuovoStato === 'consegnato') {
    o.consegnatoAt = new Date().toISOString();
  } else if (nuovoStato !== 'consegnato') {
    o.consegnatoAt = null;
  }
  o.stato = nuovoStato;
  o.note = fd.get('note');
  o.righe = righe;

  saveData();
  closeModal();
  render();
  toast(isNew ? `Ordine ${o.numero} creato` : 'Ordine aggiornato');
}

function deleteOrdine(id, fromScheda) {
  const o = data.ordini.find(x => x.id === id);
  if (!o) return;
  if (!confirm(`Eliminare l'ordine ${o.numero}?`)) return;
  const clienteId = o.clienteId;
  data.ordini = data.ordini.filter(x => x.id !== id);
  saveData();
  if (fromScheda) {
    closeModal();
    setTimeout(() => apriSchedaOrdineCliente(clienteId), 100);
  }
  render();
  toast('Ordine eliminato', 'info');
}

function calcolaFattura(clienteId, ddtIds) {
  const cliente = data.clienti.find(c => c.id === clienteId);
  const ddt = ddtIds.map(id => data.spedizioni.find(s => s.id === id)).filter(Boolean);
  const righe = ddt.map(d => {
    const prodotto = data.prodotti.find(p => p.id === d.prodottoId);
    const lotto = data.lotti.find(l => l.id === d.lottoId);
    const prezzo = Number(d.prezzoUnitario) || 0;
    const quantita = Number(d.quantita) || 0;
    const aliquota = prodotto?.aliquotaIva ?? data.config.fatturazione.ivaDefault ?? 10;
    return {
      ddtId: d.id,
      ddtNumero: d.ddt,
      ddtData: d.data,
      prodottoNome: prodotto?.nome || (lotto?.prodottoNome ?? '—'),
      prodottoId: prodotto?.id || d.prodottoId,
      lottoCodice: lotto?.codice || '',
      quantita,
      prezzoUnitario: prezzo,
      aliquota,
      imponibile: round2(prezzo * quantita),
      iva: round2(prezzo * quantita * aliquota / 100),
    };
  });
  const imponibile = round2(righe.reduce((s,r) => s + r.imponibile, 0));
  const iva = round2(righe.reduce((s,r) => s + r.iva, 0));
  const f = data.config.fatturazione;
  const bollo = imponibile > (f.bolloSoglia || 77.47) && f.regimeFiscale === 'RF19' ? (Number(f.bollo) || 2) : 0;
  const totale = round2(imponibile + iva + bollo);
  return { cliente, righe, imponibile, iva, bollo, totale };
}

function confermaFattura(args) {
  const { clienteId, ddtIds, numero, data: dataDoc } = args;
  const calc = calcolaFattura(clienteId, ddtIds);
  const fattura = {
    id: uid(),
    numero,
    data: dataDoc,
    anno: parseInt(dataDoc.slice(0, 4)),
    clienteId,
    ddtIds: [...ddtIds],
    righe: calc.righe,
    imponibile: calc.imponibile,
    iva: calc.iva,
    bollo: calc.bollo,
    totale: calc.totale,
    pagata: false,
    dataPagamento: null,
    createdAt: new Date().toISOString(),
  };
  data.fatture.push(fattura);
  ddtIds.forEach(id => {
    const s = data.spedizioni.find(x => x.id === id);
    if (s) s.fatturaId = fattura.id;
  });
  data.config.fatturazione.prossimoNumero = (data.config.fatturazione.prossimoNumero || 1) + 1;
  saveData();
  closeModal();
  fatturazioneTab = 'emesse';
  render();
  toast(`Fattura ${numero} archiviata`);
}

function showFatturaPdf(id) {
  const f = data.fatture.find(x => x.id === id);
  if (!f) return;
  openFatturaPreviewModal(f.clienteId, f.id);
}

function deleteFattura(id) {
  const f = data.fatture.find(x => x.id === id);
  if (!f) return;
  if (!confirm(`Eliminare la fattura ${f.numero}? I DDT collegati torneranno disponibili per la fatturazione.`)) return;
  (f.ddtIds || []).forEach(ddtId => {
    const s = data.spedizioni.find(x => x.id === ddtId);
    if (s && s.fatturaId === id) s.fatturaId = null;
  });
  data.fatture = data.fatture.filter(x => x.id !== id);
  saveData();
  render();
  toast('Fattura eliminata', 'info');
}

function togglePagamento(id) {
  const f = data.fatture.find(x => x.id === id);
  if (!f) return;
  if (f.pagata) {
    if (!confirm(`Annullare lo stato "pagata" della fattura ${f.numero}?`)) return;
    f.pagata = false;
    f.dataPagamento = null;
    saveData();
    render();
    toast('Pagamento annullato', 'info');
  } else {
    const oggi = oggiISO();
    const dataPag = prompt(`Data di pagamento per fattura ${f.numero}:`, oggi);
    if (!dataPag) return;
    f.pagata = true;
    f.dataPagamento = dataPag;
    saveData();
    render();
    toast(`Fattura ${f.numero} segnata come pagata`);
  }
}

function generateFatturaPA(fattura) {
  const cliente = data.clienti.find(c => c.id === fattura.clienteId);
  const cfg = data.config.fatturazione;
  const az = data.config;
  const codDest = (cliente?.codiceDestinatario || cfg.codiceDestinatario || '0000000').padEnd(7, '0').slice(0, 7);
  const pec = cliente?.pec || '';
  const pivaCliente = (cliente?.piva || '').replace(/\D/g, '');
  const cfCliente = cliente?.codiceFiscale || pivaCliente;
  const pivaAz = (az.piva || '').replace(/\D/g, '');
  const idTrasm = pivaAz || '00000000000';
  const progressivo = (fattura.numero || '').replace(/[^0-9]/g, '').slice(0, 5).padStart(5, '0');

  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<p:FatturaElettronica versione="FPR12" xmlns:p="http://ivaservizi.agenziaentrate.gov.it/docs/xsd/fatture/v1.2" xmlns:ds="http://www.w3.org/2000/09/xmldsig#" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <FatturaElettronicaHeader>
    <DatiTrasmissione>
      <IdTrasmittente>
        <IdPaese>IT</IdPaese>
        <IdCodice>${escapeXml(idTrasm)}</IdCodice>
      </IdTrasmittente>
      <ProgressivoInvio>${escapeXml(progressivo)}</ProgressivoInvio>
      <FormatoTrasmissione>FPR12</FormatoTrasmissione>
      <CodiceDestinatario>${escapeXml(codDest)}</CodiceDestinatario>
      ${pec ? `<PECDestinatario>${escapeXml(pec)}</PECDestinatario>` : ''}
    </DatiTrasmissione>
    <CedentePrestatore>
      <DatiAnagrafici>
        <IdFiscaleIVA>
          <IdPaese>IT</IdPaese>
          <IdCodice>${escapeXml(pivaAz)}</IdCodice>
        </IdFiscaleIVA>
        ${az.codiceFiscale ? `<CodiceFiscale>${escapeXml(az.codiceFiscale)}</CodiceFiscale>` : ''}
        <Anagrafica><Denominazione>${escapeXml(az.azienda)}</Denominazione></Anagrafica>
        <RegimeFiscale>${escapeXml(cfg.regimeFiscale || 'RF01')}</RegimeFiscale>
      </DatiAnagrafici>
      <Sede>
        <Indirizzo>${escapeXml(az.indirizzo || '—')}</Indirizzo>
        <CAP>00000</CAP>
        <Comune>—</Comune>
        <Nazione>IT</Nazione>
      </Sede>
    </CedentePrestatore>
    <CessionarioCommittente>
      <DatiAnagrafici>
        ${pivaCliente ? `<IdFiscaleIVA><IdPaese>IT</IdPaese><IdCodice>${escapeXml(pivaCliente)}</IdCodice></IdFiscaleIVA>` : ''}
        ${cfCliente ? `<CodiceFiscale>${escapeXml(cfCliente)}</CodiceFiscale>` : ''}
        <Anagrafica><Denominazione>${escapeXml(cliente?.ragioneSociale || '—')}</Denominazione></Anagrafica>
      </DatiAnagrafici>
      <Sede>
        <Indirizzo>${escapeXml(cliente?.indirizzo || '—')}</Indirizzo>
        <CAP>00000</CAP>
        <Comune>—</Comune>
        <Nazione>IT</Nazione>
      </Sede>
    </CessionarioCommittente>
  </FatturaElettronicaHeader>
  <FatturaElettronicaBody>
    <DatiGenerali>
      <DatiGeneraliDocumento>
        <TipoDocumento>TD01</TipoDocumento>
        <Divisa>EUR</Divisa>
        <Data>${escapeXml(fattura.data)}</Data>
        <Numero>${escapeXml(fattura.numero)}</Numero>
        ${fattura.bollo > 0 ? `<DatiBollo><BolloVirtuale>SI</BolloVirtuale><ImportoBollo>${fattura.bollo.toFixed(2)}</ImportoBollo></DatiBollo>` : ''}
        <ImportoTotaleDocumento>${(fattura.totale || 0).toFixed(2)}</ImportoTotaleDocumento>
      </DatiGeneraliDocumento>
${(fattura.righe || []).filter(r => r.ddtNumero).map(r => `      <DatiDDT>
        <NumeroDDT>${escapeXml(r.ddtNumero)}</NumeroDDT>
        <DataDDT>${escapeXml(r.ddtData)}</DataDDT>
      </DatiDDT>`).join('\n')}
    </DatiGenerali>
    <DatiBeniServizi>
${(fattura.righe || []).map((r, i) => `      <DettaglioLinee>
        <NumeroLinea>${i + 1}</NumeroLinea>
        <Descrizione>${escapeXml(r.prodottoNome + (r.lottoCodice ? ' - Lotto ' + r.lottoCodice : ''))}</Descrizione>
        <Quantita>${(r.quantita || 0).toFixed(2)}</Quantita>
        <PrezzoUnitario>${(r.prezzoUnitario || 0).toFixed(4)}</PrezzoUnitario>
        <PrezzoTotale>${(r.imponibile || 0).toFixed(2)}</PrezzoTotale>
        <AliquotaIVA>${(r.aliquota || 0).toFixed(2)}</AliquotaIVA>
      </DettaglioLinee>`).join('\n')}
${aggregaIVAPerAliquota(fattura.righe).map(g => `      <DatiRiepilogo>
        <AliquotaIVA>${g.aliquota.toFixed(2)}</AliquotaIVA>
        <ImponibileImporto>${g.imponibile.toFixed(2)}</ImponibileImporto>
        <Imposta>${g.iva.toFixed(2)}</Imposta>
        <EsigibilitaIVA>I</EsigibilitaIVA>
      </DatiRiepilogo>`).join('\n')}
    </DatiBeniServizi>
  </FatturaElettronicaBody>
</p:FatturaElettronica>`;
  return xml;
}

function aggregaIVAPerAliquota(righe) {
  const map = {};
  (righe || []).forEach(r => {
    const a = r.aliquota || 0;
    if (!map[a]) map[a] = { aliquota: a, imponibile: 0, iva: 0 };
    map[a].imponibile += r.imponibile || 0;
    map[a].iva += r.iva || 0;
  });
  return Object.values(map).map(g => ({ aliquota: g.aliquota, imponibile: round2(g.imponibile), iva: round2(g.iva) }));
}

function downloadFatturaPA(id) {
  const f = data.fatture.find(x => x.id === id);
  if (!f) return;
  if (!data.config.piva) { toast('Compila la P.IVA in Impostazioni prima di generare l\'XML', 'error'); return; }
  const xml = generateFatturaPA(f);
  const pivaAz = (data.config.piva || '').replace(/\D/g, '').padStart(11, '0');
  const progressivo = (f.numero || '').replace(/[^0-9]/g, '').slice(0, 5).padStart(5, '0');
  const filename = `IT${pivaAz}_${progressivo}.xml`;
  const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast(`XML FatturaPA scaricato: ${filename}`);
}

let emailjsLoaded = false;

function loadEmailJS() {
  return new Promise((resolve, reject) => {
    if (emailjsLoaded && window.emailjs) return resolve();
    if (document.getElementById('emailjs-script')) {
      const wait = () => window.emailjs ? resolve() : setTimeout(wait, 100);
      wait();
      return;
    }
    const s = document.createElement('script');
    s.id = 'emailjs-script';
    s.src = 'https://cdn.emailjs.com/dist/email.min.js';
    s.onload = () => {
      try {
        window.emailjs.init(data.config.emailjs.publicKey);
        emailjsLoaded = true;
        resolve();
      } catch(e) { reject(e); }
    };
    s.onerror = () => reject(new Error('Caricamento EmailJS fallito'));
    document.head.appendChild(s);
  });
}

function openEmailModal(fatturaId) {
  const f = data.fatture.find(x => x.id === fatturaId);
  if (!f) return;
  const cliente = data.clienti.find(c => c.id === f.clienteId);
  const cfg = data.config.emailjs;
  const setup = cfg.serviceId && cfg.templateId && cfg.publicKey;

  showModal({
    title: `Invia fattura ${f.numero} via email`,
    body: `
      ${!setup ? `
        <div class="banner">
          <div class="banner-icon">!</div>
          <div class="banner-content">
            <div class="banner-title">EmailJS non configurato</div>
            <div>Per inviare email automaticamente devi configurare EmailJS in <a href="#" onclick="closeModal();navigateTo('dati');return false;" style="color:var(--navy);font-weight:600">Impostazioni</a>. Puoi comunque usare il pulsante "Apri in app email" qui sotto.</div>
          </div>
        </div>
      ` : ''}
      <form id="emailForm">
        <div class="form-grid">
          <div class="field field--full">
            <label class="field-label">Destinatari (TO) — separa con virgola o invio</label>
            <input type="text" class="field-input" name="to" value="${escapeHtml(cliente?.email || '')}" placeholder="cliente@email.com, altro@email.com" required>
          </div>
          <div class="field field--full">
            <label class="field-label">In copia (CC) — opzionale</label>
            <input type="text" class="field-input" name="cc" value="" placeholder="commercialista@studio.it">
          </div>
          <div class="field field--full">
            <label class="field-label">Oggetto</label>
            <input type="text" class="field-input" name="oggetto" value="Fattura ${escapeHtml(f.numero)} - ${escapeHtml(data.config.azienda)}" required>
          </div>
          <div class="field field--full">
            <label class="field-label">Messaggio</label>
            <textarea class="field-textarea" name="messaggio" style="min-height:140px" required>Buongiorno,

in allegato la fattura ${f.numero} del ${fmtDate(f.data)} per un totale di ${fmtEur(f.totale)}.

Cordiali saluti,
${data.config.azienda}</textarea>
          </div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn--ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn--ghost" onclick="apriMailto('${f.id}')">✉ Apri in app email</button>
      <button class="btn btn--amber" onclick="inviaEmailFattura('${f.id}')" ${!setup?'disabled':''}>📧 Invia con EmailJS</button>
    `
  });
}

function parseEmails(s) {
  return (s || '').split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
}

function apriMailto(fatturaId) {
  const form = document.getElementById('emailForm');
  const fd = new FormData(form);
  const to = parseEmails(fd.get('to')).join(',');
  const cc = parseEmails(fd.get('cc')).join(',');
  const subject = encodeURIComponent(fd.get('oggetto'));
  const body = encodeURIComponent(fd.get('messaggio') + '\n\n[Allega manualmente il PDF/XML della fattura]');
  const ccPart = cc ? `&cc=${cc}` : '';
  window.location.href = `mailto:${to}?subject=${subject}${ccPart}&body=${body}`;
  toast('Apro la tua app email. Allega manualmente PDF/XML.', 'info', 5000);
}

async function inviaEmailFattura(fatturaId) {
  const f = data.fatture.find(x => x.id === fatturaId);
  if (!f) return;
  const cfg = data.config.emailjs;
  if (!cfg.serviceId || !cfg.templateId || !cfg.publicKey) {
    toast('Configura EmailJS in Impostazioni', 'error');
    return;
  }
  const form = document.getElementById('emailForm');
  const fd = new FormData(form);
  const to = parseEmails(fd.get('to'));
  const cc = parseEmails(fd.get('cc'));
  if (to.length === 0) { toast('Inserisci almeno un destinatario', 'error'); return; }

  const confirmMsg = `Confermi l'invio della fattura ${f.numero}?\n\nDestinatari: ${to.join(', ')}` + (cc.length ? `\nIn copia: ${cc.join(', ')}` : '');
  if (!confirm(confirmMsg)) return;

  try {
    await loadEmailJS();
    const params = {
      to_email: to.join(', '),
      cc_email: cc.join(', '),
      subject: fd.get('oggetto'),
      message: fd.get('messaggio'),
      numero_fattura: f.numero,
      totale: fmtEur(f.totale),
      mittente: data.config.azienda,
    };
    await window.emailjs.send(cfg.serviceId, cfg.templateId, params, cfg.publicKey);
    data.emailLog.push({
      id: uid(),
      data: new Date().toISOString(),
      fatturaId: f.id,
      destinatari: [...to, ...cc.map(c => '(cc) ' + c)],
      esito: 'inviata',
    });
    saveData();
    closeModal();
    toast(`Email inviata a ${to.length} destinatari`, 'success', 4000);
  } catch(e) {
    console.error(e);
    toast('Errore invio email: ' + (e?.text || e?.message || 'sconosciuto'), 'error', 6000);
    data.emailLog.push({
      id: uid(),
      data: new Date().toISOString(),
      fatturaId: f.id,
      destinatari: [...to, ...cc.map(c => '(cc) ' + c)],
      esito: 'errore: ' + (e?.text || e?.message || 'sconosciuto'),
    });
    saveData();
  }
}

                      <input type="number" class="field-input" value="${s.minQta}" min="0" onchange="aggiornaScaglione('${cliente.id}','${p.id}',${idx},'minQta',this.value)">
                    </div>
                    <div>
                      <label style="font-size:11px;color:var(--muted)">Prezzo (€/pz)</label>
                      <input type="number" class="field-input" value="${s.prezzo}" min="0" step="0.01" onchange="aggiornaScaglione('${cliente.id}','${p.id}',${idx},'prezzo',this.value)">
                    </div>
                    <button class="btn btn--danger btn--small" onclick="rimuoviScaglione('${cliente.id}','${p.id}',${idx})">×</button>
                  </div>
                `).join('')}
                <button class="btn btn--ghost btn--small" style="justify-self:flex-start" onclick="aggiungiScaglione('${cliente.id}','${p.id}')">+ Aggiungi scaglione</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function aggiungiScaglione(clienteId, prodottoId) {
  const c = data.clienti.find(x => x.id === clienteId);
  if (!c) return;
  c.listino = c.listino || [];
  let v = c.listino.find(x => x.prodottoId === prodottoId);
  if (!v) {
    v = { prodottoId, scaglioni: [] };
    c.listino.push(v);
  }
  const ultimo = v.scaglioni[v.scaglioni.length - 1];
  const nextMin = ultimo ? (ultimo.minQta || 0) + 100 : 1;
  const p = data.prodotti.find(x => x.id === prodottoId);
  v.scaglioni.push({ minQta: nextMin, prezzo: p?.prezzoDefault || 0 });
  saveData();
  render();
}

function aggiornaScaglione(clienteId, prodottoId, idx, campo, valore) {
  const c = data.clienti.find(x => x.id === clienteId);
  if (!c) return;
  const v = c.listino.find(x => x.prodottoId === prodottoId);
  if (!v) return;
  const sortati = v.scaglioni.slice().sort((a,b)=>(a.minQta||0)-(b.minQta||0));
  const target = sortati[idx];
  if (!target) return;
  const realIdx = v.scaglioni.indexOf(target);
  v.scaglioni[realIdx][campo] = parseFloat(valore) || 0;
  saveData();
  toast('Scaglione aggiornato');
}

function rimuoviScaglione(clienteId, prodottoId, idx) {
  const c = data.clienti.find(x => x.id === clienteId);
  if (!c) return;
  const v = c.listino.find(x => x.prodottoId === prodottoId);
  if (!v) return;
  const sortati = v.scaglioni.slice().sort((a,b)=>(a.minQta||0)-(b.minQta||0));
  const target = sortati[idx];
  if (!target) return;
  v.scaglioni = v.scaglioni.filter(s => s !== target);
  if (v.scaglioni.length === 0) c.listino = c.listino.filter(x => x !== v);
  saveData();
  render();
}

function renderBackupList(filenames) {
  const el = document.getElementById('backupList');
  if (!el) return;
  if (!filenames.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:12px 0">Nessun backup giornaliero ancora presente. Il primo verrà creato alla prossima mezzanotte.</div>';
    return;
  }
  el.innerHTML = `
    <div class="card-h" style="margin-top:8px">📸 Snapshot giornalieri (${filenames.length})</div>
    <div style="display:grid;gap:6px;font-size:13px;max-height:300px;overflow-y:auto">
      ${filenames.map(fn => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--light-bg);border-radius:6px">
          <span class="mono" style="flex:1">${escapeHtml(fn)}</span>
          <button class="btn btn--ghost btn--small" onclick="restoreGistBackup('${escapeHtml(fn)}')">Ripristina</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function refreshBackupList() {
  if (currentPage !== 'sync') return;
  const list = await listGistBackups();
  renderBackupList(list);
}

function importDataSync() {
  const file = document.getElementById('importFileSync').files[0];
  if (!file) { toast('Seleziona un file di backup', 'error'); return; }
  if (!confirm('Ripristinare i dati da questo file?\n\n⚠ I dati attuali verranno SOVRASCRITTI.\n\nHai già fatto un backup di sicurezza?')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      data = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), imported);
      data.meta.ultimaSincronizzazione = new Date().toISOString();
      saveData();
      toast('Dati sincronizzati con successo!', 'success', 4000);
      render();
    } catch(err) {
      toast('File non valido: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

async function testEmailJS() {
  const cfg = data.config.emailjs;
  if (!cfg.serviceId || !cfg.templateId || !cfg.publicKey) {
    toast('Compila prima i 3 campi EmailJS e salva', 'error');

  }
  const to = prompt('Indirizzo email di destinazione per il test:', '');

  try {

    await window.emailjs.send(cfg.serviceId, cfg.templateId, {

      cc_email: '',

      numero_fattura: 'TEST',

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = oggiISO();
  a.href = url;
  a.download = `brioche-lab-backup-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
  data.meta.ultimaSincronizzazione = new Date().toISOString();
  saveData();
  toast('Backup scaricato');
}

function exportCsv(tipo) {
  let rows = [];
  let filename = '';
  if (tipo === 'lotti') {
    rows = [['Codice Lotto', 'Data', 'Turno', 'Prodotto', 'Quantità', 'TMC', 'Operatore', 'Materie usate', 'Note']];
    data.lotti.forEach(l => rows.push([l.codice, l.data, l.turno, l.prodottoNome, l.quantita, l.tmc, l.operatore || '', (l.materieUsate || '').replace(/\n/g,' '), (l.note || '').replace(/\n/g,' ')]));
    filename = 'lotti';
  } else if (tipo === 'spedizioni') {
    rows = [['Data', 'DDT', 'Cliente', 'Lotto', 'Quantità', 'Note']];
    data.spedizioni.forEach(s => {
      const c = data.clienti.find(x => x.id === s.clienteId);
      const l = data.lotti.find(x => x.id === s.lottoId);
      rows.push([s.data, s.ddt, c?.ragioneSociale || '', l?.codice || '', s.quantita, (s.note || '').replace(/\n/g,' ')]);
    });
    filename = 'spedizioni';
  } else if (tipo === 'haccp') {
    rows = [['Data', 'Ora', 'Cella (°C)', 'Abbattitore (°C)', 'Freezer (°C)', 'Operatore', 'Note']];
    data.haccp.forEach(c => rows.push([c.data, c.ora, c.tCella, c.tAbbatt, c.tFreezer, c.operatore || '', (c.note || '').replace(/\n/g,' ')]));
    filename = 'haccp';
  }
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = oggiISO();
  a.href = url;
  a.download = `${filename}-${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Esportato ${filename}.csv`);
}

function importData() {
  const file = document.getElementById('importFile').files[0];
  if (!file) { toast('Seleziona un file di backup', 'error'); return; }
  if (!confirm('Ripristinare i dati da questo file?\n\nTutti i dati attuali saranno SOVRASCRITTI.')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      data = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), imported);
      saveData();
      toast('Dati ripristinati con successo!');
      render();
    } catch(err) {
      toast('File non valido: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm('⚠ ATTENZIONE: questa azione cancellerà TUTTI i dati. Continuare?')) return;
  if (!confirm('Sei davvero sicuro? Questa azione è IRREVERSIBILE.\n\nHai esportato un backup?')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = loadData();
  render();
  toast('Tutti i dati sono stati cancellati', 'info');
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show custom prompt after 5 seconds
  setTimeout(() => {
    if (!deferredPrompt) return;
    const visited = parseInt(localStorage.getItem('visitCount') || '0');
    if (visited >= 2 && !localStorage.getItem('installPromptDismissed')) {
      showInstallPrompt();
    }
  }, 5000);
});

function showInstallPrompt() {
  const c = document.getElementById('installPromptContainer');
  c.innerHTML = `
    <div class="install-prompt">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      <div class="install-prompt-text">
        <strong>Installa l'app</strong>
        Avrai accesso più veloce e potrai usarla offline.
      </div>
      <button class="btn btn--amber btn--small" onclick="doInstall()">Installa</button>
      <button class="install-prompt-close" onclick="dismissInstall()">×</button>
    </div>
  `;
}

function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installPromptContainer').innerHTML = '';
  });
}

function dismissInstall() {
  localStorage.setItem('installPromptDismissed', '1');
  document.getElementById('installPromptContainer').innerHTML = '';
}

/* Track visits */
const visitCount = parseInt(localStorage.getItem('visitCount') || '0') + 1;

/* ════════════════════════════════════════════════════════════════════
   SERVICE WORKER (per funzionamento offline)
   ════════════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  // Inline service worker via blob
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      // Cache-first per la app (è single-file)
      e.respondWith(
        caches.open('brioche-lab-v1').then(cache =>
          cache.match(e.request).then(r => r || fetch(e.request).then(resp => {
            if (e.request.url.startsWith(self.location.origin)) {
              cache.put(e.request, resp.clone());
            }
            return resp;
          }).catch(() => cache.match('/')))
        )
      );
    });
  `;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(err => console.log('SW non registrato:', err));
}

// Online/offline detection per stato sync
window.addEventListener('online', () => {
  if (data.config.gistSync.enabled && gistStatusState.stato === 'offline') {
    setGistStatus('pending', '');
    gistManualSync();
  }
});
window.addEventListener('offline', () => {
  if (data.config.gistSync.enabled) setGistStatus('offline', 'Connessione assente');
});

// Avvia Gist sync (check cloud + backup giornaliero + polling ordini cliente)
if (data.config.gistSync.enabled && data.config.gistSync.pat && data.config.gistSync.gistId) {
  setGistStatus('syncing', 'Controllo cloud...');
  gistCheckOnBoot().then(() => {
    startPollingOrdini();
  });
}
</script>

</body>
</html>

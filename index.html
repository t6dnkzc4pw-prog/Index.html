/* ═══════════════════════════════════════════════════════════════════════
   BRIOCHE LAB PRO — Stili
   Mobile-first PWA professionale
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --navy: #1B3A6B;
  --navy-dark: #11264A;
  --navy-light: #2D5089;
  --amber: #E8A020;
  --amber-dark: #B8800F;
  --amber-bg: #FDF8F0;
  --cream: #FFFEF8;
  --light-bg: #F0F4FA;
  --green: #2E7D32;
  --green-bg: #E8F5E9;
  --red: #C0392B;
  --red-bg: #FFE5E5;
  --grey-bord: #D5D9E0;
  --grey-light: #EEF1F5;
  --text: #1A1F2E;
  --muted: #6B7280;
  --shadow-sm: 0 1px 2px rgba(27, 58, 107, 0.06);
  --shadow-md: 0 4px 12px rgba(27, 58, 107, 0.08);
  --shadow-lg: 0 8px 24px rgba(27, 58, 107, 0.12);
  --safe-top: env(safe-area-inset-top, 0);
  --safe-bot: env(safe-area-inset-bottom, 0);
}

[data-theme="dark"] {
  --navy: #4A7AB8;
  --navy-dark: #2D5089;
  --amber: #FFB840;
  --amber-bg: #2A2418;
  --cream: #1A1F2E;
  --light-bg: #0F1419;
  --green-bg: #1A2E1C;
  --red-bg: #2E1A1A;
  --grey-bord: #2A3142;
  --grey-light: #1F2433;
  --text: #E8EAF0;
  --muted: #9CA3AF;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}

[data-theme="dark"] body {
  background: var(--light-bg);
}
[data-theme="dark"] .card,
[data-theme="dark"] .kpi,
[data-theme="dark"] .table-wrap,
[data-theme="dark"] .modal {
  background: #1A2031;
  border-color: var(--grey-bord);
}
[data-theme="dark"] .table thead { background: var(--navy-dark); }
[data-theme="dark"] .table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
[data-theme="dark"] .field-input,
[data-theme="dark"] .field-select,
[data-theme="dark"] .field-textarea {
  background: #0F1419;
  color: var(--text);
  border-color: var(--grey-bord);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--light-bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body.kitchen-mode {
  font-size: 17px;
}

body.kitchen-mode .btn { padding: 14px 22px; font-size: 16px; }
body.kitchen-mode .page-title { font-size: 36px; }
body.kitchen-mode .kpi-value { font-size: 40px; }
body.kitchen-mode .table { font-size: 16px; }
body.kitchen-mode .table th, body.kitchen-mode .table td { padding: 18px 14px; }

button { font-family: inherit; cursor: pointer; border: none; font-size: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Fraunces', serif; font-weight: 700; }

/* ═══════ APP SHELL ═══════ */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ═══════ SIDEBAR ═══════ */
.sidebar {
  background: var(--navy);
  color: white;
  padding: calc(20px + var(--safe-top)) 0 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 10;
}

.brand {
  padding: 0 20px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 38px; height: 38px;
  background: var(--amber-bg);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-icon svg { width: 26px; height: 26px; }

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1.1;
}

.brand-subtitle {
  font-size: 10px;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-top: 2px;
}

.brand-accent { color: var(--amber); }

.nav { padding: 8px 0; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  color: rgba(255,255,255,0.75);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-size: 14px;
  font-weight: 500;
  user-select: none;
}

.nav-item:hover { background: rgba(255,255,255,0.05); color: white; }

.nav-item.active {
  background: rgba(232, 160, 32, 0.12);
  color: white;
  border-left-color: var(--amber);
  font-weight: 600;
}

.nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }
.nav-item.active .nav-icon { opacity: 1; color: var(--amber); }

.nav-section {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: rgba(255,255,255,0.4);
  padding: 16px 20px 6px;
  font-weight: 700;
}

.sidebar-footer {
  margin-top: 20px;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}

/* ═══════ MAIN ═══════ */
.main {
  padding: 24px 32px calc(40px + var(--safe-bot));
  max-width: 100%;
  overflow-x: hidden;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 16px;
}

.page-title {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.8px;
  color: var(--navy);
  line-height: 1.1;
}

.page-subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-top: 4px;
}

/* ═══════ MOBILE TOPBAR ═══════ */
.mobile-bar {
  display: none;
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--navy);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  align-items: center;
  justify-content: space-between;
  color: white;
}

.mobile-brand {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.menu-btn {
  width: 38px;
  height: 38px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-btn:active { background: rgba(255,255,255,0.2); }

/* ═══════ CARDS ═══════ */
.card {
  background: white;
  border-radius: 14px;
  padding: 22px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--grey-bord);
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 12px;
}

.card-h {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}

/* ═══════ KPI ═══════ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.kpi {
  background: white;
  border-radius: 14px;
  padding: 18px 20px;
  border: 1px solid var(--grey-bord);
  border-left: 4px solid var(--amber);
  box-shadow: var(--shadow-sm);
  transition: transform 0.15s;
}

.kpi:active { transform: scale(0.98); }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.kpi-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  font-weight: 700;
}

.kpi-value {
  font-family: 'Fraunces', serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--navy);
  margin-top: 6px;
  letter-spacing: -0.5px;
  line-height: 1;
}

.kpi-detail {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

.kpi--blue { border-left-color: var(--navy); }
.kpi--green { border-left-color: var(--green); }
.kpi--red { border-left-color: var(--red); }

/* ═══════ BUTTONS ═══════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.15s;
  background: var(--navy);
  color: white;
  text-decoration: none;
  white-space: nowrap;
}

.btn:hover { background: var(--navy-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { transform: none; box-shadow: none; }

.btn--amber { background: var(--amber); color: white; }
.btn--amber:hover { background: var(--amber-dark); }

.btn--ghost { background: white; color: var(--navy); border: 1px solid var(--grey-bord); }
.btn--ghost:hover { background: var(--light-bg); }
[data-theme="dark"] .btn--ghost { background: transparent; color: var(--text); }

.btn--danger { background: var(--red-bg); color: var(--red); }
.btn--danger:hover { background: var(--red); color: white; }

.btn--small { padding: 7px 12px; font-size: 13px; }
.btn--icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ═══════ FORMS ═══════ */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.field { display: flex; flex-direction: column; }

.field-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.field-input, .field-select, .field-textarea {
  padding: 11px 14px;
  border: 1.5px solid var(--grey-bord);
  border-radius: 10px;
  background: var(--cream);
  font-size: 15px;
  color: var(--text);
  transition: border 0.15s, box-shadow 0.15s;
}

.field-input:focus, .field-select:focus, .field-textarea:focus {
  outline: none;
  border-color: var(--amber);
  background: white;
  box-shadow: 0 0 0 3px rgba(232, 160, 32, 0.15);
}
[data-theme="dark"] .field-input:focus,
[data-theme="dark"] .field-select:focus,
[data-theme="dark"] .field-textarea:focus { background: #0A0E13; }

.field-textarea { resize: vertical; min-height: 80px; font-family: inherit; }
.field--full { grid-column: 1 / -1; }
.field-help { font-size: 12px; color: var(--muted); margin-top: 5px; }

/* ═══════ TABLES ═══════ */
.table-wrap {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--grey-bord);
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table thead { background: var(--navy); color: white; position: sticky; top: 0; }
.table th { padding: 13px 16px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.table td { padding: 14px 16px; border-top: 1px solid var(--grey-light); }
.table tbody tr:hover { background: var(--amber-bg); }
.table tbody tr:nth-child(even) { background: rgba(240, 244, 250, 0.4); }
.table tbody tr:nth-child(even):hover { background: var(--amber-bg); }

.table-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }

/* ═══════ PILLS ═══════ */
.pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  background: var(--light-bg);
  color: var(--navy);
}
.pill--green { background: var(--green-bg); color: var(--green); }
.pill--red { background: var(--red-bg); color: var(--red); }
.pill--amber { background: var(--amber-bg); color: var(--amber-dark); }
[data-theme="dark"] .pill { background: rgba(255,255,255,0.1); }

/* ═══════ EMPTY ═══════ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 56px; margin-bottom: 14px; opacity: 0.7; }
.empty-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  color: var(--navy);
  margin-bottom: 10px;
  font-weight: 700;
}
.empty-text { font-size: 14px; max-width: 400px; margin: 0 auto 18px; line-height: 1.6; }

/* ═══════ MODAL ═══════ */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(27, 38, 74, 0.6);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
  padding-top: max(16px, var(--safe-top));
  padding-bottom: max(16px, var(--safe-bot));
  animation: fadeIn 0.2s;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: white;
  border-radius: 18px;
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--grey-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: inherit;
  z-index: 1;
  border-radius: 18px 18px 0 0;
}

.modal-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
}

.modal-close {
  background: var(--light-bg);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 22px;
  line-height: 1;
}

.modal-close:hover { background: var(--red-bg); color: var(--red); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--grey-light);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--light-bg);
  position: sticky;
  bottom: 0;
  border-radius: 0 0 18px 18px;
}

/* ═══════ LOT CODE DISPLAY ═══════ */
.lot-display {
  background: var(--navy);
  color: white;
  padding: 14px 18px;
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-align: center;
  margin: 12px 0;
}

/* ═══════ BANNER ═══════ */
.banner {
  padding: 14px 18px;
  border-radius: 12px;
  background: var(--amber-bg);
  border-left: 4px solid var(--amber);
  margin-bottom: 20px;
  font-size: 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.banner--info { background: var(--light-bg); border-left-color: var(--navy); }
.banner--green { background: var(--green-bg); border-left-color: var(--green); }

.banner-icon {
  flex-shrink: 0;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--amber);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
}
.banner--info .banner-icon { background: var(--navy); }
.banner--green .banner-icon { background: var(--green); }
.banner-content { flex: 1; }
.banner-title { font-weight: 700; color: var(--navy); margin-bottom: 2px; }

/* ═══════ SECTION ═══════ */
.section { margin-bottom: 32px; }
.section-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 12px;
  flex-wrap: wrap;
}
.section-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  letter-spacing: -0.3px;
}
.section-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ═══════ TWO-COL ═══════ */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

/* ═══════ FAB ═══════ */
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(24px + var(--safe-bot));
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--amber);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  z-index: 50;
  border: none;
  cursor: pointer;
}
.fab:active { transform: scale(0.95); }

/* ═══════ INSTALL PROMPT ═══════ */
.install-prompt {
  position: fixed;
  bottom: calc(20px + var(--safe-bot));
  left: 20px;
  right: 20px;
  max-width: 400px;
  margin: 0 auto;
  background: var(--navy);
  color: white;
  padding: 16px 20px;
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  z-index: 99;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: slideUp 0.3s;
}
.install-prompt-text { flex: 1; font-size: 13px; line-height: 1.4; }
.install-prompt-text strong { display: block; font-size: 14px; margin-bottom: 2px; }
.install-prompt-close {
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 20px;
  padding: 4px;
}

/* ═══════ TOAST ═══════ */
.toast-container {
  position: fixed;
  top: calc(20px + var(--safe-top));
  right: 20px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: white;
  border-radius: 12px;
  padding: 12px 18px;
  box-shadow: var(--shadow-lg);
  border-left: 4px solid var(--green);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  animation: slideRight 0.3s;
  min-width: 240px;
  max-width: 360px;
  pointer-events: auto;
}

.toast--error { border-left-color: var(--red); }
.toast--info { border-left-color: var(--navy); }

@keyframes slideRight {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ═══════ TUTORIAL ═══════ */
.tutorial { max-width: 800px; }
.tutorial h2 {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  color: var(--navy);
  margin: 28px 0 12px;
  letter-spacing: -0.3px;
}
.tutorial h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--navy);
  margin: 20px 0 8px;
}
.tutorial p { margin-bottom: 12px; line-height: 1.7; }
.tutorial ul, .tutorial ol { margin: 8px 0 16px 24px; }
.tutorial li { margin-bottom: 8px; line-height: 1.6; }
.tutorial code {
  background: var(--light-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  color: var(--navy);
  font-family: 'JetBrains Mono', monospace;
}
.tutorial .info-box {
  background: var(--amber-bg);
  border-left: 4px solid var(--amber);
  padding: 16px 20px;
  margin: 16px 0;
  border-radius: 10px;
}
.tutorial .info-box-title {
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
  font-family: 'Fraunces', serif;
  font-size: 17px;
}

/* ═══════ PRINT LABEL ═══════ */
@media print {
  .sidebar, .mobile-bar, .no-print, .btn, .fab { display: none !important; }
  .main { padding: 0; }
  body { background: white; }
  .print-label { border: 2px solid black !important; box-shadow: none !important; }
}

.print-label {
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  overflow: hidden;
  max-width: 600px;
  margin: 0 auto;
}

.print-label-header {
  background: var(--navy);
  color: white;
  padding: 14px 20px;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
  letter-spacing: 0.5px;
}

.print-label-amber-line { height: 5px; background: var(--amber); }

.print-label-body {
  padding: 18px 20px;
  font-size: 13px;
  line-height: 1.7;
  color: #1A1F2E;
}

.print-label-cold {

  color: white;
  padding: 12px 20px;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
}

/* ═══════ RESPONSIVE ═══════ */
@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: -270px;
    top: 0;
    width: 260px;

<!-- ═══════════════════════════════════════════════════════════════════
     LOGICA APPLICATIVA
     ═══════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   STORAGE LAYER
   ════════════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'brioche-lab-pro-data';
const THEME_KEY = 'brioche-lab-theme';
const KITCHEN_KEY = 'brioche-lab-kitchen';

const DEFAULT_DATA = {
  prodotti: [
    { id: 'p1', codice: 'CRC', nome: 'Cornetto classico', pesoPezzo: 60, pezziCartone: 20, tmcMesi: 12 },
    { id: 'p2', codice: 'CRV', nome: 'Cornetto vuoto', pesoPezzo: 55, pezziCartone: 20, tmcMesi: 12 },
    { id: 'p3', codice: 'PNC', nome: 'Pain au chocolat', pesoPezzo: 70, pezziCartone: 20, tmcMesi: 12 },
  ],
  materie: [
    { id: 'm1', nome: 'Farina 00', unita: 'kg', lottoFornitore: '', fornitore: '', dataConsegna: '', scorta: 0, scortaMin: 10 },
    { id: 'm2', nome: 'Burro', unita: 'kg', lottoFornitore: '', fornitore: '', dataConsegna: '', scorta: 0, scortaMin: 5 },
    { id: 'm3', nome: 'Lievito', unita: 'kg', lottoFornitore: '', fornitore: '', dataConsegna: '', scorta: 0, scortaMin: 1 },
    { id: 'm4', nome: 'Zucchero', unita: 'kg', lottoFornitore: '', fornitore: '', dataConsegna: '', scorta: 0, scortaMin: 3 },
    { id: 'm5', nome: 'Uova', unita: 'pz', lottoFornitore: '', fornitore: '', dataConsegna: '', scorta: 0, scortaMin: 100 },
    { id: 'm6', nome: 'Sale', unita: 'kg', lottoFornitore: '', fornitore: '', dataConsegna: '', scorta: 0, scortaMin: 1 },
  ],
  clienti: [],
  lotti: [],
  spedizioni: [],
  haccp: [],
  config: {
    azienda: 'La mia azienda S.r.l.',
    indirizzo: 'Via Esempio 1, 00000 Città',
    piva: '',
    operatoreCorrente: '',
  },
  meta: {
    ultimaSincronizzazione: null,
    versioneApp: '1.0',
    deviceId: '',
  }
};

let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const fresh = JSON.parse(JSON.stringify(DEFAULT_DATA));
      fresh.meta.deviceId = 'dev-' + Math.random().toString(36).slice(2, 10);
      return fresh;
    }
    const parsed = JSON.parse(raw);
    const merged = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), parsed);
    if (!merged.meta) merged.meta = JSON.parse(JSON.stringify(DEFAULT_DATA.meta));
    if (!merged.meta.deviceId) merged.meta.deviceId = 'dev-' + Math.random().toString(36).slice(2, 10);
    return merged;
  } catch(e) {
    console.error('Errore lettura dati:', e);
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData() {
  try {
    data.meta.ultimoSalvataggio = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    toast('Errore nel salvataggio: ' + e.message, 'error');
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ════════════════════════════════════════════════════════════════════
   LOT CODE GENERATOR
   ════════════════════════════════════════════════════════════════════ */
function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function generateLotCode(date, turno, prodottoCodice) {
  const yy = String(date.getFullYear()).slice(-2);
  const ddd = String(dayOfYear(date)).padStart(3, '0');
  const dateStr = date.toISOString().slice(0, 10);
  const sameDay = data.lotti.filter(l =>
    l.data === dateStr && l.turno === turno && l.prodottoCodice === prodottoCodice
  );
  const nn = String(sameDay.length + 1).padStart(2, '0');
  return `L${yy}${ddd}${turno}-${prodottoCodice}-${nn}`;
}

function addMonths(date, months) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + months);
  return d;
}

function fmtDate(d) {
  if (!d) return '—';
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function fmtDateTime(d) {
  if (!d) return '—';
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ════════════════════════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════════════════════════ */
function toast(message, type = 'success', duration = 3000) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.2s';
    setTimeout(() => el.remove(), 200);
  }, duration);
}

/* ════════════════════════════════════════════════════════════════════
   THEME & KITCHEN MODE
   ════════════════════════════════════════════════════════════════════ */
function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeLabel(saved);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  updateThemeLabel(next);
}

function updateThemeLabel(theme) {
  const label = document.getElementById('themeLabel');
  if (label) label.textContent = theme === 'light' ? 'Modalità scura' : 'Modalità chiara';
}

function loadKitchenMode() {
  if (localStorage.getItem(KITCHEN_KEY) === '1') {
    document.body.classList.add('kitchen-mode');
  }
}

function toggleKitchenMode() {
  document.body.classList.toggle('kitchen-mode');
  const isOn = document.body.classList.contains('kitchen-mode');
  localStorage.setItem(KITCHEN_KEY, isOn ? '1' : '0');
  toast(isOn ? 'Modalità cucina attiva (testo grande)' : 'Modalità cucina disattivata', 'info');
}

/* ════════════════════════════════════════════════════════════════════
   SIDEBAR (mobile)
   ════════════════════════════════════════════════════════════════════ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.querySelector('.sidebar-overlay').classList.remove('open');
}

/* ════════════════════════════════════════════════════════════════════
   ROUTER
   ════════════════════════════════════════════════════════════════════ */
let currentPage = 'dashboard';

document.getElementById('navMenu').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  navigateTo(item.dataset.page);
  if (window.innerWidth <= 768) closeSidebar();
});

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });
  render();
  window.scrollTo(0, 0);
}

function render() {
  const main = document.getElementById('mainContent');
  switch (currentPage) {
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'lotti': main.innerHTML = renderLotti(); break;
    case 'prodotti': main.innerHTML = renderProdotti(); break;
    case 'materie': main.innerHTML = renderMaterie(); break;
    case 'clienti': main.innerHTML = renderClienti(); break;
    case 'spedizioni': main.innerHTML = renderSpedizioni(); break;
    case 'haccp': main.innerHTML = renderHaccp(); break;
    case 'guida': main.innerHTML = renderGuida(); break;
    case 'sync': main.innerHTML = renderSync(); break;
    case 'dati': main.innerHTML = renderDati(); break;
  }
}

/* ════════════════════════════════════════════════════════════════════
   PAGE: DASHBOARD
   ════════════════════════════════════════════════════════════════════ */
function renderDashboard() {
  const oggi = new Date().toISOString().slice(0, 10);
  const lottiOggi = data.lotti.filter(l => l.data === oggi).length;
  const totPezzi = data.lotti.reduce((s, l) => s + (parseInt(l.quantita) || 0), 0);
  const totPezziOggi = data.lotti.filter(l => l.data === oggi).reduce((s, l) => s + (parseInt(l.quantita) || 0), 0);
  const speOggi = data.spedizioni.filter(s => s.data === oggi).length;
  const materieScarse = data.materie.filter(m => parseFloat(m.scorta) < parseFloat(m.scortaMin)).length;
  const ultimiLotti = [...data.lotti].sort((a, b) => (b.codice || '').localeCompare(a.codice || '')).slice(0, 5);
  const ultimiHaccp = [...data.haccp].sort((a, b) => (b.data + (b.ora||'')).localeCompare(a.data + (a.ora||''))).slice(0, 3);

  const now = new Date();
  const greeting = now.getHours() < 12 ? 'Buongiorno!' : now.getHours() < 19 ? 'Buon pomeriggio!' : 'Buonasera!';

  return `
    <div class="page-header">
      <div>
        <div class="page-title">${greeting}</div>
        <div class="page-subtitle">${now.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</div>
      </div>
      <button class="btn btn--amber" onclick="navigateTo('lotti'); setTimeout(()=>openLottoModal(),100)">
        + Nuovo lotto
      </button>
    </div>

    ${materieScarse > 0 ? `
      <div class="banner">
        <div class="banner-icon">!</div>

let lottiFilter = { search: '', prodotto: '', dataDa: '', dataA: '' };

function renderLotti() {
  let lotti = [...data.lotti];

  if (lottiFilter.search) {
    const q = lottiFilter.search.toLowerCase();
    lotti = lotti.filter(l =>
      (l.codice || '').toLowerCase().includes(q) ||
      (l.prodottoNome || '').toLowerCase().includes(q) ||
      (l.operatore || '').toLowerCase().includes(q)
    );
  }
  if (lottiFilter.prodotto) {
    lotti = lotti.filter(l => l.prodottoId === lottiFilter.prodotto);
  }
  if (lottiFilter.dataDa) {
    lotti = lotti.filter(l => l.data >= lottiFilter.dataDa);
  }
  if (lottiFilter.dataA) {
    lotti = lotti.filter(l => l.data <= lottiFilter.dataA);
  }

  lotti.sort((a, b) => (b.codice || '').localeCompare(a.codice || ''));

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Produzione &amp; Lotti</div>
        <div class="page-subtitle">${data.lotti.length} lotti totali · ${lotti.length} mostrati</div>
      </div>
      <button class="btn btn--amber" onclick="openLottoModal()">+ Nuovo lotto</button>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="form-grid">
        <div class="field">
          <label class="field-label">Cerca</label>
          <input type="text" class="field-input" placeholder="Codice, prodotto, operatore..."
            value="${escapeHtml(lottiFilter.search)}" oninput="lottiFilter.search=this.value;render()">
        </div>
        <div class="field">
          <label class="field-label">Prodotto</label>
          <select class="field-select" onchange="lottiFilter.prodotto=this.value;render()">
            <option value="">Tutti</option>
            ${data.prodotti.map(p => `<option value="${p.id}" ${lottiFilter.prodotto===p.id?'selected':''}>${escapeHtml(p.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Da data</label>
          <input type="date" class="field-input" value="${lottiFilter.dataDa}" onchange="lottiFilter.dataDa=this.value;render()">
        </div>
        <div class="field">
          <label class="field-label">A data</label>
          <input type="date" class="field-input" value="${lottiFilter.dataA}" onchange="lottiFilter.dataA=this.value;render()">
        </div>
      </div>
      ${(lottiFilter.search || lottiFilter.prodotto || lottiFilter.dataDa || lottiFilter.dataA) ?
        `<div style="margin-top:12px"><button class="btn btn--ghost btn--small" onclick="lottiFilter={search:'',prodotto:'',dataDa:'',dataA:''};render()">× Cancella filtri</button></div>` : ''}
    </div>

    ${lotti.length === 0 ? `
      <div class="card empty">
        <div class="empty-icon">🥐</div>
        <div class="empty-title">${data.lotti.length === 0 ? 'Nessun lotto ancora' : 'Nessun risultato'}</div>
        <div class="empty-text">${data.lotti.length === 0
          ? 'Quando produci un lotto, registralo qui per generare automaticamente il codice di tracciabilità e la scadenza.'
          : 'Modifica i filtri per vedere altri risultati.'}</div>
        ${data.lotti.length === 0 ? `<button class="btn btn--amber" onclick="openLottoModal()">Registra il primo lotto</button>` : ''}
      </div>
    ` : `
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Lotto</th>
              <th>Data</th>
              <th>Turno</th>
              <th>Prodotto</th>
              <th>Q.tà</th>
              <th>TMC</th>
              <th>Operatore</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${lotti.map(l => `
              <tr>
                <td class="mono"><strong style="color:var(--navy)">${escapeHtml(l.codice)}</strong></td>
                <td>${fmtDate(l.data)}</td>
                <td>${l.turno === 'M' ? 'Mattina' : l.turno === 'P' ? 'Pomer.' : 'Notte'}</td>
                <td>${escapeHtml(l.prodottoNome)}</td>
                <td><strong>${l.quantita}</strong> pz</td>

function openLottoModal(lottoId) {

  const turnoSuggerito = ora < 13 ? 'M' : ora < 19 ? 'P' : 'N';

  showModal({
    title: lotto ? 'Modifica lotto' : 'Nuovo lotto di produzione',
    body: `
      <form id="lottoForm">
        <div class="form-grid">
          <div class="field">
            <label class="field-label">Data produzione</label>
            <input type="date" class="field-input" name="data" value="${lotto?.data || oggi}" required>
          </div>
          <div class="field">
            <label class="field-label">Turno</label>
            <select class="field-select" name="turno" required>
              <option value="M" ${(lotto?.turno || turnoSuggerito)==='M'?'selected':''}>Mattina (M)</option>
              <option value="P" ${(lotto?.turno || turnoSuggerito)==='P'?'selected':''}>Pomeriggio (P)</option>
              <option value="N" ${(lotto?.turno || turnoSuggerito)==='N'?'selected':''}>Notte (N)</option>
            </select>
          </div>
          <div class="field field--full">
            <label class="field-label">Prodotto</label>
            <select class="field-select" name="prodottoId" required>
              <option value="">— Seleziona prodotto —</option>
              ${data.prodotti.map(p => `<option value="${p.id}" ${lotto?.prodottoId===p.id?'selected':''}>${escapeHtml(p.nome)} (${p.codice})</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">Quantità prodotta (pz)</label>
            <input type="number" class="field-input" name="quantita" value="${lotto?.quantita || ''}" min="1" required inputmode="numeric">
          </div>
          <div class="field">
            <label class="field-label">Operatore</label>
            <input type="text" class="field-input" name="operatore" value="${escapeHtml(lotto?.operatore || data.config.operatoreCorrente || '')}" placeholder="Nome operatore">
          </div>
          <div class="field field--full">
            <label class="field-label">Materie prime utilizzate</label>
            <textarea class="field-textarea" name="materieUsate" placeholder="Es. Farina lotto F2024-187 (Molino Bianco), Burro lotto B45 (Galbani)...">${escapeHtml(lotto?.materieUsate || '')}</textarea>
            <div class="field-help">Indica i lotti delle materie prime per la tracciabilità a monte</div>
          </div>
          <div class="field field--full">
            <label class="field-label">Note</label>
            <textarea class="field-textarea" name="note" placeholder="Eventuali annotazioni">${escapeHtml(lotto?.note || '')}</textarea>
          </div>
        </div>
        ${lotto ? `<div class="lot-display" style="margin-top:20px">${lotto.codice}</div>` : ''}
      </form>
    `,
    footer: `
      <button class="btn btn--ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn--amber" onclick="saveLotto('${lottoId || ''}')">${lotto ? 'Salva modifiche' : 'Genera lotto'}</button>
    `
  });
}

function saveLotto(lottoId) {
  const form = document.getElementById('lottoForm');
  const fd = new FormData(form);
  const prodottoId = fd.get('prodottoId');
  if (!prodottoId) { toast('Seleziona un prodotto', 'error'); return; }
  const prodotto = data.prodotti.find(p => p.id === prodottoId);
  if (!prodotto) { toast('Prodotto non valido', 'error'); return; }
  const dateStr = fd.get('data');
  const date = new Date(dateStr);
  const turno = fd.get('turno');

  let lotto;
  if (lottoId) {
    lotto = data.lotti.find(l => l.id === lottoId);
  } else {
    const codice = generateLotCode(date, turno, prodotto.codice);
    lotto = { id: uid(), codice, createdAt: new Date().toISOString() };
    data.lotti.push(lotto);
  }

  lotto.data = dateStr;
  lotto.turno = turno;
  lotto.prodottoId = prodottoId;
  lotto.prodottoCodice = prodotto.codice;
  lotto.prodottoNome = prodotto.nome;
  lotto.quantita = parseInt(fd.get('quantita'));
  lotto.operatore = fd.get('operatore');
  lotto.materieUsate = fd.get('materieUsate');
  lotto.note = fd.get('note');
  lotto.tmc = addMonths(date, prodotto.tmcMesi).toISOString().slice(0,10);

  if (lotto.operatore) {
    data.config.operatoreCorrente = lotto.operatore;
  }

  saveData();
  closeModal();
  render();
  toast(lottoId ? 'Lotto aggiornato' : `Lotto ${lotto.codice} creato`);
}

function deleteLotto(id) {
  const lotto = data.lotti.find(l => l.id === id);
  if (!lotto) return;
  const usato = data.spedizioni.some(s => s.lottoId === id);
  let msg = `Eliminare il lotto ${lotto.codice}?`;
  if (usato) msg = `Attenzione: ci sono spedizioni collegate al lotto ${lotto.codice}. Eliminare comunque?`;
  if (!confirm(msg)) return;
  data.lotti = data.lotti.filter(l => l.id !== id);
  saveData();
  render();
  toast('Lotto eliminato', 'info');
}

function printLabel(id) {
  const l = data.lotti.find(x => x.id === id);
  if (!l) return;
  const prodotto = data.prodotti.find(p => p.id === l.prodottoId);
  const pesoTot = prodotto ? prodotto.pesoPezzo * l.quantita : 0;

  showModal({
    title: 'Etichetta cartone',
    body: `
      <div style="text-align:center;margin-bottom:16px;color:var(--muted);font-size:13px">

          ${escapeHtml(data.config.indirizzo)}<br>

          <strong>LOTTO:</strong> <span style="font-size:16px">${escapeHtml(l.codice)}</span><br>
          <strong>TMC:</strong> ${fmtDate(l.tmc)}

        <div class="print-label-cold">

    footer: `
      <button class="btn btn--ghost" onclick="closeModal()">Chiudi</button>
      <button class="btn btn--amber" onclick="window.print()">🖨 Stampa</button>
    `
  });
}

function importDataSync() {
  const file = document.getElementById('importFileSync').files[0];
  if (!file) { toast('Seleziona un file di backup', 'error'); return; }
  if (!confirm('Ripristinare i dati da questo file?\n\n⚠ I dati attuali verranno SOVRASCRITTI.\n\nHai già fatto un backup di sicurezza?')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      data = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_DATA)), imported);
      data.meta.ultimaSincronizzazione = new Date().toISOString();
      saveData();
      toast('Dati sincronizzati con successo!', 'success', 4000);
      render();
    } catch(err) {
      toast('File non valido: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function saveConfig() {

  data.config.piva = fd.get('piva');

  saveData();
  toast('Dati aziendali salvati');
}

function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `brioche-lab-backup-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
  data.meta.ultimaSincronizzazione = new Date().toISOString();
  saveData();
  toast('Backup scaricato');
}

function exportCsv(tipo) {
  let rows = [];
  let filename = '';
  if (tipo === 'lotti') {
    rows = [['Codice Lotto', 'Data', 'Turno', 'Prodotto', 'Quantità', 'TMC', 'Operatore', 'Materie usate', 'Note']];
    data.lotti.forEach(l => rows.push([l.codice, l.data, l.turno, l.prodottoNome, l.quantita, l.tmc, l.operatore || '', (l.materieUsate || '').replace(/\n/g,' '), (l.note || '').replace(/\n/g,' ')]));
    filename = 'lotti';
  } else if (tipo === 'spedizioni') {
    rows = [['Data', 'DDT', 'Cliente', 'Lotto', 'Quantità', 'Note']];
    data.spedizioni.forEach(s => {
      const c = data.clienti.find(x => x.id === s.clienteId);
      const l = data.lotti.find(x => x.id === s.lottoId);
      rows.push([s.data, s.ddt, c?.ragioneSociale || '', l?.codice || '', s.quantita, (s.note || '').replace(/\n/g,' ')]);
    });
    filename = 'spedizioni';
  } else if (tipo === 'haccp') {
    rows = [['Data', 'Ora', 'Cella (°C)', 'Abbattitore (°C)', 'Freezer (°C)', 'Operatore', 'Note']];
    data.haccp.forEach(c => rows.push([c.data, c.ora, c.tCella, c.tAbbatt, c.tFreezer, c.operatore || '', (c.note || '').replace(/\n/g,' ')]));
    filename = 'haccp';
  }
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `${filename}-${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Esportato ${filename}.csv`);
}

  if (!confirm('Ripristinare i dati da questo file?\n\nTutti i dati attuali saranno SOVRASCRITTI.')) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);

function resetData() {

/* ════════════════════════════════════════════════════════════════════
   PWA INSTALL PROMPT
   ════════════════════════════════════════════════════════════════════ */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show custom prompt after 5 seconds
  setTimeout(() => {
    if (!deferredPrompt) return;
    const visited = parseInt(localStorage.getItem('visitCount') || '0');
    if (visited >= 2 && !localStorage.getItem('installPromptDismissed')) {
      showInstallPrompt();
    }
  }, 5000);
});

function showInstallPrompt() {
  const c = document.getElementById('installPromptContainer');
  c.innerHTML = `
    <div class="install-prompt">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      <div class="install-prompt-text">
        <strong>Installa l'app</strong>
        Avrai accesso più veloce e potrai usarla offline.
      </div>
      <button class="btn btn--amber btn--small" onclick="doInstall()">Installa</button>
      <button class="install-prompt-close" onclick="dismissInstall()">×</button>
    </div>
  `;
}

function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installPromptContainer').innerHTML = '';
  });
}

function dismissInstall() {
  localStorage.setItem('installPromptDismissed', '1');
  document.getElementById('installPromptContainer').innerHTML = '';
}

/* Track visits */
const visitCount = parseInt(localStorage.getItem('visitCount') || '0') + 1;
localStorage.setItem('visitCount', visitCount);

/* ════════════════════════════════════════════════════════════════════
   SERVICE WORKER (per funzionamento offline)
   ════════════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  // Inline service worker via blob
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      // Cache-first per la app (è single-file)
      e.respondWith(
        caches.open('brioche-lab-v1').then(cache =>
          cache.match(e.request).then(r => r || fetch(e.request).then(resp => {
            if (e.request.url.startsWith(self.location.origin)) {
              cache.put(e.request, resp.clone());
            }
            return resp;
          }).catch(() => cache.match('/')))
        )
      );
    });
  `;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(err => console.log('SW non registrato:', err));
}
